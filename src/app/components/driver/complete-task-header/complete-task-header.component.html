<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Completed Tasks</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

     .header-container {
      text-align: center;
      margin-top: 1px;
      padding: 40px 30px;
      backdrop-filter: blur(10px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      max-width: 1600px;
      width: 100%;
      position: relative;
      overflow: hidden;
      animation: slideInUp 0.8s ease-out;
    }

    .header-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.8s ease;
    }

    .header-container:hover::before {
      left: 100%;
    }


    .title {
      font-size: clamp(32px, 8vw, 46px);
      font-weight: 700;
      background: linear-gradient(135deg, #1a202c 0%, #2d3748 50%, #4a5568 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      margin-bottom: 16px;
      position: relative;
      animation: titleGlow 2s ease-in-out infinite alternate;
    }

    .title::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, #667eea, #053f91);
      border-radius: 2px;
      animation: underlineExpand 1s ease-out 0.5s both;
    }

    .subtitle {
      font-size: clamp(18px, 4vw, 24px);
      color: #4a5568;
      font-weight: 500;
      line-height: 1.6;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.3s both;
    }

    @keyframes slideInUp {
      from { transform: translateY(60px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeInUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes titleGlow {
      from { filter: drop-shadow(0 0 5px rgba(102, 126, 234, 0.3)); }
      to { filter: drop-shadow(0 0 15px rgba(102, 126, 234, 0.6)); }
    }

    @keyframes underlineExpand {
      from { width: 0; }
      to { width: 60px; }
    }

    @media (max-width: 768px) {
      .header-container { margin-top: 40px; padding: 30px 20px; border-radius: 20px; }
    }

    @media (max-width: 480px) {
      .header-container { margin-top: 20px; padding: 25px 15px; }
      .title::after { width: 40px; height: 3px; }
    }
  </style>
</head>
<body>
  <div class="header-container">
    <h1 class="title">Completed Tasks</h1>
    <p class="subtitle">Review the details of this Completed task</p>
  </div>
</body>
</html>
