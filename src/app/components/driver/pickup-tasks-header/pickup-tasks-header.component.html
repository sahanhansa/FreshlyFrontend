<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pickup Tasks</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }



    .title {
      font-family: "Inter", sans-serif;
      font-size: clamp(10px, 8vw,46px);
      font-weight: 700;
      background: linear-gradient(135deg, #1a202c 0%, #2d3748 50%, #4a5568 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      margin-bottom: 16px;
      position: relative;
      animation: titleGlow 2s ease-in-out infinite alternate;
    }

    .title::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, #667eea, #053f91);
      border-radius: 2px;
      animation: underlineExpand 1s ease-out 0.5s both;
    }

    .subtitle {
      font-family: "Inter", sans-serif;
      font-size: clamp(18px, 4vw, 24px);
      color: #4a5568;
      font-weight: 500;
      line-height: 1.6;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out 0.3s both;
    }

    @keyframes slideInUp {
      from { transform: translateY(60px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeInUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes titleGlow {
      from { filter: drop-shadow(0 0 5px rgba(102, 126, 234, 0.3)); }
      to { filter: drop-shadow(0 0 15px rgba(102, 126, 234, 0.6)); }
    }

    @keyframes underlineExpand {
      from { width: 0; }
      to { width: 60px; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(5deg); }
    }

    @media (max-width: 768px) {
      .header-container { margin-top: 40px; padding: 30px 20px; border-radius: 20px; }
    }

    @media (max-width: 480px) {
      .header-container { margin-top: 20px; padding: 25px 15px; }
      .title::after { width: 40px; height: 3px; }
    }
  </style>
</head>
<body>
  <div class="header-container">
    <h5 class="title">Pickup Tasks</h5>
    <p class="subtitle">Here are the pending pickups assigned to you</p>
  </div>
</body>
</html>
