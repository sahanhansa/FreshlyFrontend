<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">


<div class="logout-container">

    <i class="fa fa-sign-out" style="color: #007bff; font-size: 50px;"></i>
    <h2>LOG OUT</h2>
    <p>Are you sure you want to log out from Freshly?</p>
    <div class="buttons">
      <button class="no-button" (click)="cancelLogout()">NO</button>
      <button class="yes-button" (click)="confirmLogout()">YES</button>
    </div>
  </div>
