<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<div class="contact-container">
    <!-- Left Section (Contact Info) -->
    <div class="contact-info">
      <h2>Contact Information</h2>
      <p>Let us know how we can assist you today!</p>
      <p><i class="fa fa-phone"></i> +1012 3456 789</p>
      <p><i class="fa fa-envelope"></i> demo&#64;gmail.com</p>
      <p><i class="fa fa-map-marker"></i> 132 Dartmouth Street Boston, Massachusetts 02156</p>
    </div>
  
    <!-- Right Section (Form) -->
    <div class="contact-form">
      <div class="input-group">
        <div class="input-field">
          <label>First Name</label>
          <input type="text" placeholder="First Name">
        </div>
        <div class="input-field">
          <label>Last Name</label>
          <input type="text" placeholder="Last Name">
        </div>
      </div>
  
      <div class="input-group">
        <div class="input-field">
          <label>Email</label>
          <input type="email" placeholder="Email">
        </div>
        <div class="input-field">
          <label>Mobile Number</label>
          <input type="text" value="+1 012 3456 789" readonly>
        </div>
      </div>
  
      <label>Select Subject?</label>
      <div class="radio-group">
        <label><input type="radio" name="subject" checked> General Inquiry</label>
        <label><input type="radio" name="subject"> Laundry Issues</label>
        <label><input type="radio" name="subject"> Payment Issues</label>
        <label><input type="radio" name="subject"> Other</label>
      </div>
  
      <label>Message</label>
      <textarea placeholder="Write your message.."></textarea>
  
      <button class="send-button">Send Message</button>
    </div>
  </div>
