<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<div class="contact-container relative">
  <!-- ✅ Spinner overlay -->
  <div *ngIf="isLoading"
    class="absolute inset-0 bg-white bg-opacity-70 flex items-center justify-center z-50">
    <svg class="animate-spin h-10 w-10 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none"
      viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor"
        d="M4 12a8 8 0 018-8V0C5.372 0 0 5.373 0 12h4z"></path>
    </svg>
  </div>

  <!-- Left Section (Contact Info) -->
  <div class="contact-info">
    <h2>Contact Information</h2>
    <p>Let us know how we can assist you today!</p>
    <p><i class="fa fa-phone"></i> +1012 3456 789</p>
    <p><i class="fa fa-envelope"></i> demo&#64;gmail.com</p>
    <p><i class="fa fa-map-marker"></i> 132 Dartmouth Street Boston, Massachusetts 02156</p>
  </div>

  <!-- Right Section (Form) -->
  <div class="contact-form">
    <div class="input-group">
      <div class="input-field">
        <label>First Name</label>
        <input type="text" placeholder="First Name" [(ngModel)]="firstName" name="firstName" readonly>
      </div>
      <div class="input-field">
        <label>Last Name</label>
        <input type="text" placeholder="Last Name" [(ngModel)]="lastName" name="lastName">
      </div>
    </div>

    <div class="input-group">
      <div class="input-field">
        <label>Email</label>
        <input type="email" placeholder="Email" [(ngModel)]="email" name="email" readonly>
      </div>
      <div class="input-field">
        <label>Phone Number</label>
        <input type="text" placeholder="Phone Number" [(ngModel)]="phoneNumber" name="phoneNumber">
      </div>
    </div>

    <label>Select Subject?</label>
    <div class="radio-group">
      <label><input type="radio" name="subject" [(ngModel)]="selectedSubject" value="General Inquiry" checked>
        General Inquiry</label>
      <label><input type="radio" name="subject" [(ngModel)]="selectedSubject" value="Laundry Issues"> Laundry
        Issues</label>
      <label><input type="radio" name="subject" [(ngModel)]="selectedSubject" value="Payment Issues"> Payment
        Issues</label>
      <label><input type="radio" name="subject" [(ngModel)]="selectedSubject" value="Other"> Other</label>
    </div>

    <label>Message</label>
    <textarea placeholder="Write your message.." [(ngModel)]="message" name="message"></textarea>
    <div class="my-2 text-sm text-red-600 bg-red-50 border border-red-200 px-3 py-2 rounded-md" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button
      class="flex items-center justify-center gap-2 px-5 py-2 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
      (click)="onSubmit()" [disabled]="isSubmitting || isLoading">

      <svg *ngIf="isSubmitting" class="w-4 h-4 animate-spin text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
        viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.372 0 0 5.373 0 12h4z"></path>
      </svg>

      {{ isSubmitting ? 'Sending...' : 'Send Message' }}
    </button>

  </div>
</div>
