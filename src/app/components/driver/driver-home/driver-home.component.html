<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Welcome Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'pulse-ring': 'pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        'pulse-ring': {
                            '0%': { transform: 'scale(0.33)', opacity: '1' },
                            '80%, 100%': { transform: 'scale(1)', opacity: '0' },
                        },
                        slideInRight: {
                            '0%': { transform: 'translateX(200px)', opacity: '0' },
                            '100%': { transform: 'translateX(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-white font-inter">
    <!-- Welcome Section -->
    <div class="relative p-8 mb-8 overflow-visible bg-gradient-to-br">
        <div class="relative flex items-start justify-between mb-6">
            <div class="relative z-10 max-w-[58%]">
                <!-- Enhanced Welcome Header -->
                <div class="mb-8">
                    <h1 class="mb-4 font-bold leading-tight font-inter">
                        <span class="block text-5xl bg-gradient-to-r from-gray-800 to-gray-600 bg-clip-text text-transparent">Welcome</span>
                        <span class="block text-5xl bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent" id="customerName">{{customerName}}</span>
                    </h1>
                    <p class="text-gray-600 text-2xl mb-2 font-medium">Manage Your Pickups And Delivery Tasks Efficiently</p>
                    <div class="w-24 h-1 bg-gradient-to-r from-blue-500 to-purple-500 rounded-full"></div>
                </div>
                
                <!-- Enhanced Stats Cards in 2x2 Grid -->
                <div class="grid grid-cols-2 gap-8">
                    <!-- Pickups Card -->
                    <div class="w-80 h-44 bg-gradient-to-br from-white to-gray-50 rounded-2xl shadow-lg border border-gray-100 transition-all duration-300 hover:-translate-y-3 hover:scale-105 hover:shadow-2xl group cursor-pointer">
                        <div class="flex items-center w-full h-full gap-6 p-8">
                            <div class="relative">
                                <div class="w-16 h-16 bg-gradient-to-r from-blue-500 to-blue-600 rounded-xl flex items-center justify-center shadow-lg group-hover:shadow-blue-200 group-hover:shadow-xl transition-all duration-300">
                                    <i class="text-2xl text-white fas fa-box group-hover:scale-110 transition-transform duration-300"></i>
                                </div>
                                <div class="absolute -top-1 -right-1 w-6 h-6 bg-green-500 rounded-full flex items-center justify-center animate-pulse">
                                    <span class="text-xs text-white font-bold">42</span>
                                </div>
                            </div>
                            <div class="flex-1">
                                <h2 class="mb-2 text-3xl font-bold text-gray-800 tabular-nums counter" data-target="156">0</h2>
                                <p class="text-gray-600 text-lg font-medium">Total Pickups</p>
                                
                            </div>
                        </div>
                    </div>
                    
                    <!-- Deliveries Card -->
                    <div class="w-80 h-44 bg-gradient-to-br from-white to-gray-50 rounded-2xl shadow-lg border border-gray-100 transition-all duration-300 hover:-translate-y-3 hover:scale-105 hover:shadow-2xl group cursor-pointer">
                        <div class="flex items-center w-full h-full gap-6 p-8">
                            <div class="relative">
                                <div class="w-16 h-16 bg-gradient-to-r from-green-500 to-green-600 rounded-xl flex items-center justify-center shadow-lg group-hover:shadow-green-200 group-hover:shadow-xl transition-all duration-300">
                                    <i class="text-2xl text-white fas fa-truck group-hover:scale-110 transition-transform duration-300"></i>
                                </div>
                                <div class="absolute -top-1 -right-1 w-6 h-6 bg-blue-500 rounded-full flex items-center justify-center animate-bounce">
                                    <span class="text-xs text-white font-bold">24</span>
                                </div>
                            </div>
                            <div class="flex-1">
                                <h2 class="mb-2 text-3xl font-bold text-gray-800 tabular-nums counter" data-target="89">0</h2>
                                <p class="text-gray-600 text-lg font-medium">Total Deliveries</p>
                                
                            </div>
                        </div>
                    </div>
                    
                    <!-- Working Hours Card -->
                    <div class="w-80 h-44 bg-gradient-to-br from-white to-gray-50 rounded-2xl shadow-lg border border-gray-100 transition-all duration-300 hover:-translate-y-3 hover:scale-105 hover:shadow-2xl group cursor-pointer">
                        <div class="flex items-center w-full h-full gap-6 p-8">
                            <div class="relative">
                                <div class="w-16 h-16 bg-gradient-to-r from-orange-500 to-orange-600 rounded-xl flex items-center justify-center shadow-lg group-hover:shadow-orange-200 group-hover:shadow-xl transition-all duration-300">
                                    <i class="text-2xl text-white fas fa-clock group-hover:scale-110 transition-transform duration-300"></i>
                                </div>
                                <div class="absolute -top-1 -right-1 w-3 h-3 bg-orange-400 rounded-full animate-pulse-ring"></div>
                            </div>
                            <div class="flex-1">
                                <h2 class="mb-2 text-3xl font-bold text-gray-800 tabular-nums counter" data-target="248">0</h2>
                                <p class="text-gray-600 text-lg font-medium">Working Hours</p>
                                
                            </div>
                        </div>
                    </div>
                    
                    <!-- Revenue Card -->
                    <div class="w-80 h-44 bg-gradient-to-br from-white to-gray-50 rounded-2xl shadow-lg border border-gray-100 transition-all duration-300 hover:-translate-y-3 hover:scale-105 hover:shadow-2xl group cursor-pointer">
                        <div class="flex items-center w-full h-full gap-6 p-8">
                            <div class="relative">
                                <div class="w-16 h-16 bg-gradient-to-r from-purple-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg group-hover:shadow-purple-200 group-hover:shadow-xl transition-all duration-300">
                                    <i class="text-2xl text-white fas fa-dollar-sign group-hover:scale-110 transition-transform duration-300"></i>
                                </div>
                                <div class="absolute -top-1 -right-1 w-6 h-6 bg-yellow-500 rounded-full flex items-center justify-center animate-spin">
                                    <i class="text-xs text-white fas fa-star"></i>
                                </div>
                            </div>
                            <div class="flex-1">
                                <h2 class="mb-2 text-3xl font-bold text-gray-800 tabular-nums counter" data-target="12450">$0</h2>
                                <p class="text-gray-600 text-lg font-medium">Total Revenue</p>
                                
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Image Section -->
            <div class="absolute right-0 top-0 w-[40%] h-full overflow-hidden">
                <img src="assets/hero.png" alt="Analytics Presentation" class="object-contain w-full h-auto animate-[slideInRight_2s_ease-in-out]">
                <div class="relative w-[40%]">
                    <img src="assets/hero.png" alt="Analytics Presentation" class="object-contain w-full h-auto animate-[slideInRight_2.5s_ease-in-out_0.5s_both]">
                </div>
            </div>
        </div>
    </div>

    <script>
        // Enhanced interactions and animations
        document.addEventListener('DOMContentLoaded', function() {
            // Add number counting animation
            const counters = document.querySelectorAll('.counter');
            
            const animateCounter = (counter) => {
                const target = parseInt(counter.getAttribute('data-target'));
                const isRevenue = counter.textContent.includes('$');
                let current = 0;
                const increment = target / 100;
                const timer = setInterval(() => {
                    current += increment;
                    if (current >= target) {
                        current = target;
                        clearInterval(timer);
                    }
                    if (isRevenue) {
                        counter.textContent = '$' + Math.floor(current).toLocaleString();
                    } else {
                        counter.textContent = Math.floor(current);
                    }
                }, 20);
            };

            // Use Intersection Observer to trigger animations when cards are visible
            const observerOptions = {
                threshold: 0.5
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const counter = entry.target.querySelector('.counter');
                        if (counter && counter.textContent === '0' || counter.textContent === '$0') {
                            setTimeout(() => animateCounter(counter), Math.random() * 500);
                        }
                    }
                });
            }, observerOptions);

            // Observe all cards
            counters.forEach(counter => {
                observer.observe(counter.closest('.group'));
            });

            // Dynamic customer name (you can replace this with actual data)
            const customerNameElement = document.getElementById('customerName');
            if (customerNameElement) {
                customerNameElement.textContent = 'John Doe'; // Replace with actual customer name
            }
        });
    </script>
</body>
</html>
