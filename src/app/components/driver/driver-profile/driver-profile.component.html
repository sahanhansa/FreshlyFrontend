<div class="flex flex-col md:flex-row bg-[#eaf6ff]  shadow-lg rounded-3xl overflow-hidden w-full max-w-5xl mx-auto">
  <!-- Sidebar -->
  <div class="bg-[#3a9ee1] text-white flex flex-col items-center p-6 w-full md:w-1/3">
    <img [src]="photoUrl" alt="Driver Photo" class="w-32 h-32 rounded-full object-cover mb-4 border-4 border-white" />
    <h2 class="text-xl font-semibold mb-1">{{ name }}</h2>
    <p class="text-sm mb-6">Driver ID: {{ id }}</p>

    <div class="flex flex-col w-full gap-3">
      <a class="bg-white text-blue-600 py-2 rounded-full flex justify-between items-center px-4 font-semibold hover:bg-gray-100"
      [routerLink]="['/complete-tasks-page']">
        Completed Orders <span>➔</span>
      </a>
      <button class="bg-white text-blue-600 py-2 rounded-full flex justify-between items-center px-4 font-semibold hover:bg-gray-100">
        View Reports <span>➔</span>
      </button>
      <button [routerLink]="['/edit-details-form']" class="bg-white text-blue-600 py-2 rounded-full flex justify-between items-center px-4 font-semibold hover:bg-gray-100">
        Edit Details <span>➔</span>
      </button>
      <button [routerLink]="['/logout-page']" class="bg-[#d32525] text-white py-2 rounded-full flex justify-between items-center px-4 font-semibold hover:bg-red-700">
        LOG OUT <span>➔</span>
      </button>
    </div>
  </div>

 
 <!-- Details Section -->
<div class="flex-1 p-8">
  <h3 class="text-3xl font-bold mb-6">Driver Information</h3>

  <div class="flex flex-col gap-4 text-gray-800">
    <!-- Name -->
    <div class="flex items-center">
      <span class="mr-3 text-xl">👤</span>
      <span class="font-semibold text-lg w-40">Name</span>
      <span class="font-medium text-base">:</span>
      <span class="ml-2 text-base">{{ name }}</span>
    </div>

    <!-- Driver ID -->
    <div class="flex items-center">
      <span class="mr-3 text-xl">🆔</span>
      <span class="font-semibold text-lg w-40">Driver ID</span>
      <span class="font-medium text-base">:</span>
      <span class="ml-2 text-base">{{ id }}</span>
    </div>

    <!-- License Number -->
    <div class="flex items-center">
      <span class="mr-3 text-xl">📄</span>
      <span class="font-semibold text-lg w-40">License Number</span>
      <span class="font-medium text-base">:</span>
      <span class="ml-2 text-base">{{ licenseNumber }}</span>
    </div>

    <!-- Email -->
    <div class="flex items-center">
      <span class="mr-3 text-xl">✉️</span>
      <span class="font-semibold text-lg w-40">Email</span>
      <span class="font-medium text-base">:</span>
      <span class="ml-2 text-base">{{ email }}</span>
    </div>

    <!-- Contact No -->
    <div class="flex items-center">
      <span class="mr-3 text-xl">📞</span>
      <span class="font-semibold text-lg w-40">Contact No</span>
      <span class="font-medium text-base">:</span>
      <span class="ml-2 text-base">{{ contact }}</span>
    </div>

    <!-- Home Address -->
    <div class="flex items-start">
      <span class="mr-3 text-xl">🏠</span>
      <span class="font-semibold text-lg w-40">Home Address</span>
      <span class="font-medium text-base">:</span>
      <span class="ml-2 text-base">{{ address }}</span>
    </div>

    <!-- Vehicle No -->
    <div class="flex items-center">
      <span class="mr-3 text-xl">🚗</span>
      <span class="font-semibold text-lg w-40">Vehicle No</span>
      <span class="font-medium text-base">:</span>
      <span class="ml-2 text-base">{{ vehicleNo }}</span>
    </div>

    <!-- Location -->
    <div class="flex items-center">
      <span class="mr-3 text-xl">📍</span>
      <span class="font-semibold text-lg w-40">Location</span>
      <span class="font-medium text-base">:</span>
      <span class="ml-2 text-base">{{ location }}</span>
    </div>
  </div>
</div>
