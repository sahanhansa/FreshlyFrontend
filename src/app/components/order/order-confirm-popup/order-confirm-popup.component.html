<div class="fixed inset-0 z-50 flex items-center justify-center p-2">
  <div class="fixed inset-0 backdrop-blur-[2px] bg-black bg-opacity-40 z-40"></div>
  <div class="bg-white rounded-xl shadow-xl max-w-sm w-full mx-auto p-5 z-50 relative border border-blue-100 flex flex-col items-center">
    <!-- Header with Close -->
    <div class="flex items-center justify-between w-full mb-3">
      <div></div>
      <div class="flex-1 flex justify-center items-center">
        <svg class="h-8 w-8 text-green-500 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2l4-4" />
        </svg>
        <h2 class="text-xl font-bold text-blue-700">Confirm Your Order</h2>
      </div>
      <button
        class="text-gray-400 hover:text-blue-600 p-1 rounded-full hover:bg-blue-50 transition-colors duration-200"
        (click)="cancel.emit()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <!-- Fast Delivery Image -->
    <div class="w-full flex justify-center mb-2">
      <img src="assets/order/fast-delivery.png" alt="Fast Delivery" class="h-24 w-24 object-contain" />
    </div>
    <!-- Info Section -->
    <div class="mb-4 w-full">
      <div class="flex items-center gap-2 text-blue-600 text-base mb-1 justify-center">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h1l2 7h10l2-7h1"/>
        </svg>
        <span class="font-semibold">You're almost done!</span>
      </div>
      <p class="text-gray-600 text-sm text-center">
        Double-check your details. You can still go back and make changes if needed.
      </p>
    </div>
    <!-- Confirmation Message -->
    <div class="w-full flex flex-col items-center mb-4">
      <span class="text-green-700 font-semibold text-base mb-1">All set for a fresh experience!</span>
      <span class="text-xs text-gray-400 text-center">You will receive a confirmation notification after placing your order.</span>
    </div>
    <!-- Action Buttons -->
    <div class="flex justify-between items-center gap-3 w-full mt-2">
      <button
        type="button"
        (click)="back.emit()"
        class="px-4 py-1.5 rounded-md bg-green-500 text-white hover:bg-green-600 font-semibold transition text-sm"
      >
        ← Back
      </button>
      <div class="flex gap-2">
        <button
          (click)="cancel.emit()"
          class="px-4 py-1.5 rounded-md bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold transition text-sm">
          Cancel
        </button>
        <button
          (click)="confirm.emit()"
          class="px-4 py-1.5 rounded-md bg-blue-600 text-white hover:bg-blue-700 font-semibold transition text-sm">
          Confirm
        </button>
      </div>
    </div>
  </div>
</div>
