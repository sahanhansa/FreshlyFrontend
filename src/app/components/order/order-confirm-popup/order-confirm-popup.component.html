<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-sm z-40" (click)="cancel.emit()"></div>

  <!-- Modal Content -->
  <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full mx-auto p-6 z-50 relative border border-gray-200 flex flex-col items-center text-center">
    
    <!-- Success Icon -->
    <div class="w-16 h-16 flex items-center justify-center bg-green-100 rounded-full mb-4">
      <svg class="w-10 h-10 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
    </div>

    <!-- Header Text -->
    <h2 class="text-2xl font-bold text-gray-800 mb-2">Order Confirmed!</h2>
    
    <!-- Info Text -->
    <p class="text-gray-600 text-sm mb-6">
      Thank you for your purchase. Your order is now being processed. You can track its progress in the "Ongoing Orders" section.
    </p>

    <!-- Action Button -->
    <button
      (click)="confirm.emit()"
      class="w-full px-5 py-3 rounded-lg bg-blue-600 text-white hover:bg-blue-700 font-semibold transition text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
      View My Orders
    </button>

    <!-- Close button can be added for accessibility if needed -->
    <button
      class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 p-1 rounded-full hover:bg-gray-100 transition-colors"
      (click)="cancel.emit()"
      aria-label="Close"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
</div>
