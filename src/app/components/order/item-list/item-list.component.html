<div class="container mx-auto px-4 py-6">  
  <!-- Loading indicator -->
  @if (loading) {
    <div class="flex justify-center items-center py-12">
      <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
    </div>
  }
  
  <!-- Error state -->
  <div *ngIf="error" class="text-center text-red-500 py-10" role="alert">
    {{ error }}
    <br />
    <button (click)="loadItems()" class="mt-3 px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">
      Try Again
    </button>
  </div>
  
  <!-- No items message -->
  @if (!loading && items.length === 0 && !error) {
    <div class="text-center py-12">
      <p class="text-gray-500 text-lg">No laundry items available at the moment.</p>
    </div>
  }
  
  <!-- Items grid -->
  @if (items.length > 0) {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      @for (item of items; track item.itemId) {
        <app-item-card [item]="item"></app-item-card>
      }
    </div>
  }
</div>
