<div class="max-w-4xl mx-auto p-1 sm:p-2">
  <div class="rounded-lg shadow-sm hover:shadow-lg transition-all duration-300 ease-in-out bg-white transform hover:scale-[1.01]">
    <div class="px-5 py-4">
      <!-- Header section -->
      <div class="flex justify-between items-start">
        <div>
          <h4 class="text-sm text-gray-600">{{ orderId }}</h4>
          <h1 class="font-medium text-gray-900 text-lg">{{ laundryName }}</h1>
          <p class="text-xs text-gray-500 mt-1">{{ date }}</p>
        </div>
        <div class="text-right">
          <p class="text-lg font-bold text-gray-900">Rs. {{ totalAmount }}</p>
          
          <!-- Completed tag -->
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-50 text-green-700 border border-green-200 mt-2 justify-end">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            Delivered
          </span>
        </div>
      </div>
      
      <!-- Order items section -->
      <div class="mt-3 pt-3 border-t border-gray-100">
        <div class="flex items-center justify-between mb-2">
          <h4 class="text-sm font-medium text-gray-700">Order Items</h4>
          <span class="text-xs text-gray-500">{{ getTotalItems() }} items</span>
        </div>
        
        <div class="space-y-1.5 max-h-24 overflow-y-auto custom-scrollbar">
          <!-- Display quantity next to item name -->
          <div *ngFor="let item of items" class="text-sm text-gray-600">
            <span class="flex items-center">
              <span class="w-1.5 h-1.5 rounded-full bg-blue-500 mr-2 opacity-70 flex-shrink-0"></span>
              {{ item.name }} <span class="text-gray-500 ml-1">x{{ item.quantity }}</span>
            </span>
          </div>
        </div>
      </div>
      
      <!-- Rate link - replaced button with elegant link -->
      <div class="mt-4 pt-3 border-t border-gray-100 flex justify-end">
        <a 
          (click)="onRateClick()"
          class="rate-link inline-flex items-center gap-1.5 text-indigo-600 hover:text-indigo-800 text-sm font-medium transition-colors duration-200 group cursor-pointer">
          <span class="flex items-center justify-center bg-indigo-50 h-6 w-6 rounded-full group-hover:bg-indigo-100 transition-colors duration-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-indigo-500 group-hover:text-indigo-700 transition-colors duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
            </svg>
          </span>
          <span class="group-hover:border-indigo-500 pb-0.5 transition-colors duration-200">Rate this order</span>
        </a>
      </div>
    </div>
  </div>
</div>
