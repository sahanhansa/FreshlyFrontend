<div class="max-w-5xl mx-auto p-4 bg-white">
  <!-- Header Section -->
  <div class="mb-4">
    <h2 class="text-xl font-bold text-gray-800">Pending Orders</h2>
    <p class="text-gray-600 text-sm">Complete your orders by placing them when you're ready</p>
  </div>
  
  <!-- Orders Container -->
  <div class="space-y-4 animate-fadeIn">
    <!-- Show when no orders are available -->
    <div *ngIf="pendingOrders.length === 0" class="rounded-lg p-8 text-center">
      <p class="text-gray-500 mb-4">You don't have any pending orders</p>
      <button (click)="createNewOrder()" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-6 rounded transition-colors duration-200">
        Order Now
      </button>
    </div>
    
    <!-- Show when orders are available -->
    <div *ngIf="pendingOrders.length > 0">
      <div *ngFor="let order of pendingOrders">
        <app-order-summary
          [orderId]="order.id"
          [laundryName]="order.laundryName"
          [items]="order.items"
          [showLaundryInfo]="true"
          (deleteOrderEvent)="onDeleteOrder($event)">
        </app-order-summary>
      </div>
    </div>
  </div>
</div>
