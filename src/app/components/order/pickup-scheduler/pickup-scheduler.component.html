<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-sm z-40" (click)="cancel.emit()"></div>

  <!-- Modal Content -->
  <div class="bg-white rounded-xl shadow-2xl max-w-md w-full mx-auto p-6 z-50 relative border border-gray-200">
    <!-- Modal Header -->
    <div class="flex justify-between items-start mb-4">
      <div>
        <h3 class="text-xl font-bold text-gray-800 flex items-center gap-2">
          <svg class="h-6 w-6 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          Schedule Pickup
        </h3>
        <p class="text-sm text-gray-500 mt-1">Choose a time that works for you.</p>
      </div>
      <button class="text-gray-400 hover:text-gray-700 p-1 rounded-full hover:bg-gray-100 transition-colors"
              (click)="cancel.emit()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Info Alert -->
    <div class="bg-blue-50 border-l-4 border-blue-400 text-blue-800 p-3 rounded-r-lg mb-6 text-sm">
      You can schedule a pickup up to two weeks in advance. Our team will arrive at your location at the chosen time.
    </div>

    <!-- Date & Time Input -->
    <div class="mb-6">
      <label for="pickup-datetime" class="block text-sm font-medium text-gray-700 mb-2">
        Select Pickup Date & Time
      </label>
      <input
        id="pickup-datetime"
        type="datetime-local"
        class="w-full rounded-lg border px-4 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-shadow"
        [ngClass]="{'border-gray-300': !isTimeInvalid, 'border-red-500 ring-red-500': isTimeInvalid}"
        [min]="minDateTime"
        [max]="maxDateTime"
        [(ngModel)]="selectedDateTime"
        (ngModelChange)="validateTime()"
        step="1800"
      />
      <p *ngIf="isTimeInvalid" class="text-red-600 text-xs mt-2">
        Please select a time between 6:00 AM and 6:00 PM.
      </p>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end items-center gap-3 pt-4 border-t border-gray-200">
      <button
        (click)="onConfirm()"
        [disabled]="!selectedDateTime || isTimeInvalid"
        class="px-5 py-2.5 rounded-lg bg-blue-600 text-white hover:bg-blue-700 font-semibold transition text-sm shadow-sm disabled:bg-blue-300 disabled:cursor-not-allowed">
        Confirm Pickup
      </button>
    </div>
  </div>
</div>
