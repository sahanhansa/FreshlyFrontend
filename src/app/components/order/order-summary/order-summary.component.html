<div class="max-w-3xl mx-auto p-4 sm:p-6 bg-white rounded-lg shadow-lg my-5 transition-all duration-300 hover:shadow-xl">
  <!-- Header with -->
  <div class="bg-white pb-3 border-b border-gray-200 ">
    <div class="bg-white flex justify-between items-center">
      <h2 class="text-lg font-semibold text-gray-800">Order Summary</h2>
      <p class="text-sm text-gray-500 font-medium">Order ID: <span class="font-bold text-gray-800">{{ orderId }}</span></p>
    </div>
    <p class="text-sm text-gray-600">{{ laundryName }}</p>
  </div>

  <!-- Order Items -->
  <div class="space-y-3">
    <div *ngFor="let item of orderItems" class="flex items-center py-2.5 border-b border-gray-100 hover:bg-gray-50 transition-colors duration-200 rounded px-2 relative">

      <!-- Item Image -->
      <div class="w-16 h-16 bg-gray-100 rounded-lg overflow-hidden flex-shrink-0 shadow-sm transform transition-transform hover:scale-105">
        <img [src]="item.image" alt="{{ item.name }}" class="w-full h-full object-cover">
      </div>

      <!-- Item Details -->
      <div class="ml-4 flex-grow">
        <div class="flex flex-col">
          <div class="flex justify-between items-start">
            <h3 class="font-medium text-gray-800 text-base">{{ item.name }}</h3>
            <button
              class="text-gray-400 hover:text-red-500 transition-colors duration-200 p-1 rounded-full hover:bg-red-50 -mt-1 -mr-1"
              (click)="deleteItem(item.itemId, item.serviceId)">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
          <p class="text-sm text-gray-600">
            <!-- <span *ngIf="item.categoryName">{{ item.categoryName }},</span>  -->
            <span class="text-blue-600">{{ item.washMethod }}</span>
          </p>
          <div class="flex justify-between items-center mt-1.5">
            <p class="text-xs font-bold text-gray-500">Rs.{{ item.price }} x {{ item.quantity }}</p>
            <p class="text-l font-bold text-gray-800">Rs. {{ item.price * item.quantity }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Total Row -->
  <div class="flex items-center py-3 bg-gray-50 rounded-md px-3 mt-1">
    <div class="ml-4 flex-grow">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-lg text-gray-800">Total Amount</h3>
        <p class="font-bold text-xl text-gray-900">Rs. {{ total }}</p>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="flex flex-wrap justify-end items-center mt-5">
    <div class="flex gap-3">
      <button (click)="deleteOrder()" class="bg-red-500 hover:bg-red-600 text-white py-2 px-5 rounded-md transition-colors duration-200">Delete</button>
      <button (click)="placeOrder()" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-5 rounded-md transition-colors duration-200">Order Now</button>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal with Backdrop -->
<div *ngIf="showDeleteConfirmation">
  <!-- Backdrop -->
  <div class="fixed inset-0  backdrop-blur-sm z-10"></div>
  <!-- Modal Box -->
  <div
    class="fixed left-1/2 top-1/2 z-50 bg-white rounded-xl shadow-2xl max-w-md w-full p-8 flex flex-col items-center -translate-x-1/2 -translate-y-1/2"
    role="dialog"
    aria-modal="true"
    aria-labelledby="deleteOrderTitle">
    <div class="flex flex-col items-center">
      <div class="bg-red-100 rounded-full p-3 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
      <h2 id="deleteOrderTitle" class="text-xl font-semibold text-gray-900 mb-2">Delete Order</h2>
      <p class="text-gray-700 text-center mb-6">Are you sure you want to delete this order? This action cannot be undone.</p>
    </div>
    <div class="flex justify-center gap-4 w-full">
      <button
        (click)="cancelDelete()"
        class="px-5 py-2 rounded-md bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium transition"
      >
        Cancel
      </button>
      <button
        (click)="confirmDelete()"
        class="px-5 py-2 rounded-md bg-red-500 hover:bg-red-600 text-white font-medium transition"
      >
        Delete
      </button>
    </div>
  </div>
</div>

<!-- Pickup Scheduler Popup -->
<app-pickup-scheduler
  *ngIf="showPickupScheduler"
  (confirm)="onPickupConfirm($event)"
  (cancel)="showPickupScheduler = false">
</app-pickup-scheduler>

<app-customer-address-popup
  *ngIf="showAddressPopup"
  [customerId]="customerId"
  (confirmOrder)="onAddressNext($event)"
  (cancel)="showAddressPopup = false"
  (back)="onAddressBack()">
</app-customer-address-popup>

<app-order-confirm-popup
  *ngIf="showOrderConfirmPopup"
  (confirm)="onOrderConfirm()"
  (cancel)="onOrderCancel()"
  (back)="onOrderBack()">
</app-order-confirm-popup>
