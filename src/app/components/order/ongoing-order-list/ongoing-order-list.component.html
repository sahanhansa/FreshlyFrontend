<div class="max-w-5xl mx-auto p-4">
    <!-- Header Section -->
    <div class="mb-2">
      <h2 class="text-xl font-bold text-gray-800">Ongoing Orders</h2>
      <p class="text-gray-600 text-sm">Click the order to see the order status</p>
    </div>
    
    <!-- Orders Container -->
    <div>
      <!-- Show when no orders are available -->
      <div *ngIf="ongoingOrders.length === 0" class="bg-gray-50 rounded-lg p-8 text-center">
        <p class="text-gray-500 mb-4">You don't have any ongoing orders</p>
        <button class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-6 rounded transition-colors duration-200">
          Order Now
        </button>
      </div>
      
      <!-- Custom styling for cards with NO spacing -->
      <div class="space-y-0">
        <app-order-card 
          *ngFor="let order of ongoingOrders"
          [orderId]="order.id"
          [laundryName]="order.laundryName"
          [date]="order.date"
          [totalAmount]="order.totalAmount"
          [items]="order.items"
          [status]="order.status"
          (orderClicked)="showOrderStatus(order)">
        </app-order-card>
      </div>
    </div>
  
    <!-- Order Status Modal Component -->
    <app-order-status
      [visible]="showStatusModal"
      [order]="selectedOrder"
      (close)="closeModal()">
    </app-order-status>
  </div>
