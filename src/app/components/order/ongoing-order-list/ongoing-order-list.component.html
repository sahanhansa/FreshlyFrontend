<div class="max-w-5xl mx-auto">
  <!-- Loading state -->
  <div *ngIf="isLoading" class="flex justify-center py-10">
    <div class="flex flex-col items-center">
      <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-500 rounded-full animate-spin"></div>
      <p class="mt-4 text-gray-600">Loading your orders...</p>
    </div>
  </div>

  <!-- Error state -->
  <div *ngIf="error && !isLoading" class="bg-red-50 border border-red-200 text-red-700 p-4 rounded-lg my-4 text-center">
    <p>{{ error }}</p>
    <button 
      (click)="loadOngoingOrders()" 
      class="mt-2 px-4 py-1 bg-red-100 hover:bg-red-200 rounded-md text-red-700 text-sm transition-colors">
      Try Again
    </button>
  </div>

  <!-- Empty state -->
  <div *ngIf="!isLoading && !error && ongoingOrders.length === 0" class="text-center py-10">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
    </svg>
    <p class="text-gray-500 mt-4">You have no ongoing orders at the moment</p>
    <p class="text-gray-400 text-sm mt-1">Orders will appear here after checkout</p>
  </div>

  <!-- Orders list -->
  <div *ngIf="!isLoading && ongoingOrders.length > 0" class="space-y-4">
    <app-order-card
      *ngFor="let order of ongoingOrders"
      [orderId]="order.orderIdFormatted"
      [laundryName]="order.laundryName"
      [date]="order.orderDateFormatted"
      [items]="order.items"
      [totalAmount]="order.totalAmount"
      [status]="'ongoing'"
      [currentStep]="mapStatusToStep(order.status)"
      (orderClicked)="viewOrderDetails(order.orderId)">
    </app-order-card>
  </div>

  <!-- Order Status Modal -->
  <app-order-status
    [visible]="showOrderStatus"
    [order]="selectedOrder"
    (close)="closeOrderStatus()"
    (cancel)="cancelOrder($event)">
  </app-order-status>
</div>
