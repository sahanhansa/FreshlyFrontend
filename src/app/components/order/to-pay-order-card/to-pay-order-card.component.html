<div class="max-w-4xl mx-auto p-1 sm:p-2">
  <div class="rounded-lg shadow-sm hover:shadow-lg transition-all duration-300 ease-in-out bg-white transform hover:scale-[1.01]">
    <div class="px-5 py-4">
      <!-- Header section -->
      <div class="flex justify-between items-start">
        <div>
          <h4 class="text-sm text-gray-600">{{ orderId }}</h4>
          <h1 class="font-medium text-gray-900 text-lg">{{ laundryName }}</h1>
          <p class="text-xs text-gray-500 mt-1">{{ date }}</p>
        </div>
        <div class="text-right">
          <p class="text-lg font-bold text-gray-900">Rs. {{ totalAmount }}</p>
          
          <!-- Payment required tag - moved under the total -->
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-50 text-yellow-700 border border-yellow-200 mt-2 justify-end">
            <span class="animate-pulse mr-1.5 h-2 w-2 rounded-full bg-yellow-500"></span>
            Payment Required
          </span>
        </div>
      </div>
      
      <!-- Order items section -->
      <div class="mt-3 pt-3 border-t border-gray-100">
        <div class="flex items-center justify-between mb-2">
          <h4 class="text-sm font-medium text-gray-700">Order Items</h4>
          <span class="text-xs text-gray-500">{{ getTotalItems() }} items</span>
        </div>
        
        <div class="space-y-1.5 max-h-24 overflow-y-auto custom-scrollbar">
          <!-- Updated to display quantity next to item name -->
          <div *ngFor="let item of items" class="text-sm text-gray-600">
            <span class="flex items-center">
              <span class="w-1.5 h-1.5 rounded-full bg-blue-500 mr-2 opacity-70 flex-shrink-0"></span>
              {{ item.name }} <span class="text-gray-500 ml-1">x{{ item.quantity }}</span>
            </span>
          </div>
        </div>
      </div>
      
      <!-- Action buttons - Payment button right, View Note by Laundry link left -->
      <div class="mt-4 pt-3 border-t border-gray-100 flex justify-between items-center">
        <!-- View Note by Laundry link -->
        <a 
          href="javascript:void(0)" 
          (click)="showLaundryNote = true"
          class="text-blue-600 hover:text-blue-800 text-sm font-medium transition-colors duration-200 flex items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 17l4 4m0 0l4-4m-4 4V3" />
          </svg>
          View Note by Laundry
        </a>
        <button 
          (click)="onPayClick()"
          class="pay-button flex items-center gap-2 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white py-1.5 px-4 rounded-md text-sm font-medium transition-all duration-300 shadow-sm hover:shadow focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          Make Payment
        </button>
      </div>

      <!-- Laundry Note Popup -->
      <div *ngIf="showLaundryNote" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-sm w-full mx-4 overflow-hidden">
          <div class="px-6 py-5">
            <div class="flex justify-between items-center mb-2">
              <h3 class="text-lg font-semibold text-blue-700">Note from Laundry</h3>
              <button (click)="showLaundryNote = false" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
            <p class="text-gray-700 text-sm mt-2">
              There is no note for this order from the laundry.
            </p>
            <div class="mt-5 flex justify-end">
              <button (click)="showLaundryNote = false"
                class="px-4 py-1.5 bg-blue-500 hover:bg-blue-600 text-white rounded-md text-sm font-medium transition-colors">
                Close
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
