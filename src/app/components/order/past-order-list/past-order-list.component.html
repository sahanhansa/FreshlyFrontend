<div class="max-w-5xl mx-auto p-4">
  <!-- Header Section -->
  <div class="mb-2">
    <h2 class="text-xl font-bold text-gray-800">Past Orders</h2>
    <p class="text-gray-600 text-sm">Your order history</p>
  </div>
  
  <!-- Orders Container -->
  <div>
    <!-- Show when no orders are available -->
    <div *ngIf="pastOrders.length === 0" class="bg-gray-50 rounded-lg p-8 text-center">
      <p class="text-gray-500 mb-4">You don't have any past orders</p>
      <button class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-6 rounded transition-colors duration-200">
        Order Now
      </button>
    </div>
    
    <!-- Custom styling for cards with reduced spacing -->
    <div class="space-y-0 -mt-2">
      <app-order-card 
        *ngFor="let order of pastOrders"
        [orderId]="order.id"
        [laundryName]="order.laundryName"
        [date]="order.date"
        [totalAmount]="order.totalAmount"
        [items]="order.items"
        [status]="order.status"
        [currentStep]="order.currentStep"
        class="block mb-2">
      </app-order-card>
    </div>
  </div>
</div>
