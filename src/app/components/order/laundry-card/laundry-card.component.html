<div class="bg-white shadow-md rounded-lg m-2 p-4 w-full sm:w-48 md:w-60 border border-gray-200 relative">
  <!-- Favorite Button -->
  <button class="absolute top-2 right-2 text-blue-500 hover:text-blue-700">
    ❤️
  </button>

  <!-- Laundry Image -->
  <div class="flex justify-center mb-3">
    <img [src]="imageUrl" alt="Laundry Image" class="w-24 h-24 object-contain">
  </div>

  <!-- Name and Location -->
  <h3 class="text-lg font-semibold text-gray-900 text-center">{{ name }}</h3>
  <p class="text-xs text-gray-500 text-center">{{ location }}</p>

  <!-- Star Ratings -->
  <div class="flex justify-center mt-2 space-x-1 text-yellow-500">
    <span *ngFor="let star of getStars(rating)">⭐</span>
  </div>

  <!-- Select Button -->
  <button class="mt-3 w-full bg-blue-500 text-white py-1.5 rounded-md hover:bg-blue-600 text-sm">
    Select Laundry
  </button>
</div>
