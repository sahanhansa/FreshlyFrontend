<div
  class="bg-white shadow-lg rounded-lg m-3 p-6 w-full sm:w-60 md:w-72 border border-gray-300 relative transform transition-transform duration-300 hover:scale-105 hover:border-blue-400"
>
  <!-- Favorite Button -->
  <button
    class="absolute top-3 right-3 text-gray-400 hover:text-red-500"
    (click)="toggleFavorite()"
  >
    <i [class]="isFavorite ? 'fas fa-heart text-red-500' : 'far fa-heart'"></i>
  </button>

  <!-- Laundry Image -->
  <div class="flex justify-center mb-4">
    <img [src]="imageUrl" alt="Laundry Image" class="w-32 h-32 object-contain">
  </div>

  <!-- Name and Location -->
  <h3 class="text-xl font-semibold text-gray-900 text-center">{{ name }}</h3>
  <p class="text-sm text-gray-500 text-center">{{ location }}</p>

  <!-- Star Ratings -->
  <div class="flex justify-center mt-3 space-x-1 text-yellow-500">
    <span *ngFor="let star of getStars(rating)">⭐</span>
  </div>

  <!-- Select Button -->
  <button
    class="mt-4 w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600 text-base"
    (click)="onSelectLaundry()"
  >
    Select Laundry
  </button>
</div>
