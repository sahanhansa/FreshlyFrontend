<div class="fixed inset-0 z-50 flex items-center justify-center p-2">
  <div class="fixed inset-0 backdrop-blur-[2px] z-40"></div>
  <div class="bg-white rounded-xl shadow-xl max-w-md w-full mx-auto p-6 z-50 relative border border-blue-100">
    <div class="flex items-center gap-2 flex-1 justify-center mb-3">
      <svg class="h-6 w-6 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 01-8 0M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      <h3 class="text-lg font-bold text-blue-700">Confirm Your Address</h3>
      <button class="ml-auto text-gray-400 hover:text-blue-600 p-1 rounded-full hover:bg-blue-50 transition-colors duration-200"
              (click)="cancel.emit()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div class="mb-3">
      <div class="flex items-center gap-2 text-blue-600 text-sm mb-1">
        <span class="font-semibold">We deliver happiness to your doorstep!</span>
      </div>
      <p class="text-gray-600 text-sm">
        Make sure your address is up to date so our team can find you easily and deliver your laundry on time.
      </p>
    </div>
    <div *ngIf="loading" class="text-center text-gray-500 py-4 text-base">Loading address...</div>
    <div *ngIf="error" class="text-center text-red-500 py-4 text-base">{{ error }}</div>
    <form *ngIf="!loading && !error" (ngSubmit)="onConfirmOrder()" class="space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">House No</label>
          <input class="w-full rounded border border-blue-300 px-2 py-1 text-sm focus:ring-2 focus:ring-blue-400" [(ngModel)]="address.houseNo" name="houseNo" required />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Street</label>
          <input class="w-full rounded border border-blue-300 px-2 py-1 text-sm focus:ring-2 focus:ring-blue-400" [(ngModel)]="address.street" name="street" required />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
          <input class="w-full rounded border border-blue-300 px-2 py-1 text-sm focus:ring-2 focus:ring-blue-400" [(ngModel)]="address.city" name="city" required />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Postal Code</label>
          <input class="w-full rounded border border-blue-300 px-2 py-1 text-sm focus:ring-2 focus:ring-blue-400" [(ngModel)]="address.postalCode" name="postalCode" required />
        </div>
      </div>
      <div class="mt-1 text-xs text-gray-400 text-center">
        Your address is kept private and is only used for pickup and delivery purposes.
      </div>
      <div class="flex justify-between items-center gap-3 mt-4">
        <button type="button" (click)="back.emit()" class="px-4 py-1.5 rounded-md bg-transparent text-blue-700 hover:bg-gray-100 font-semibold transition text-sm flex items-center gap-2">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
          Back
        </button>
        <button type="submit" class="px-4 py-1.5 rounded-md bg-blue-600 text-white hover:bg-blue-700 font-semibold transition shadow text-sm">Confirm Order</button>
      </div>
    </form>
  </div>
</div>
