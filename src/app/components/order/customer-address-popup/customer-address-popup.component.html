<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black bg-opacity-40 backdrop-blur-sm z-40" (click)="cancel.emit()"></div>

  <!-- Modal Content -->
  <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full mx-auto p-6 z-50 relative border border-gray-200">
    
    <!-- Modal Header -->
    <div class="flex justify-between items-start mb-4">
      <div class="flex items-center gap-3">
        <div class="bg-blue-100 p-2 rounded-full">
          <svg class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </div>
        <div>
          <h3 class="text-xl font-bold text-gray-800">Confirm Your Address</h3>
          <p class="text-sm text-gray-500 mt-1">Ensure your pickup & delivery location is correct.</p>
        </div>
      </div>
      <button class="text-gray-400 hover:text-gray-700 p-1 rounded-full hover:bg-gray-100 transition-colors"
              (click)="cancel.emit()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading" class="flex flex-col items-center justify-center py-10">
      <div class="w-8 h-8 border-2 border-gray-200 border-t-blue-500 rounded-full animate-spin"></div>
      <p class="mt-3 text-gray-600">Loading address...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="error" class="text-center text-red-600 bg-red-50 p-4 rounded-lg">
      <p class="font-semibold">Error</p>
      <p>{{ error }}</p>
    </div>

    <!-- Address Form -->
    <form *ngIf="!loading && !error" (ngSubmit)="onConfirmOrder()" class="space-y-4 pt-4 border-t border-gray-200">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="houseNo" class="block text-sm font-medium text-gray-700 mb-1">House No</label>
          <input id="houseNo" type="text" class="w-full rounded-lg border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm" [(ngModel)]="address.houseNo" name="houseNo" required />
        </div>
        <div>
          <label for="street" class="block text-sm font-medium text-gray-700 mb-1">Street</label>
          <input id="street" type="text" class="w-full rounded-lg border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm" [(ngModel)]="address.street" name="street" required />
        </div>
        <div>
          <label for="city" class="block text-sm font-medium text-gray-700 mb-1">City</label>
          <input id="city" type="text" class="w-full rounded-lg border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm" [(ngModel)]="address.city" name="city" required />
        </div>
        <div>
          <label for="postalCode" class="block text-sm font-medium text-gray-700 mb-1">Postal Code</label>
          <input id="postalCode" type="text" class="w-full rounded-lg border-gray-300 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm" [(ngModel)]="address.postalCode" name="postalCode" required />
        </div>
      </div>
      
      <div class="pt-2 text-xs text-gray-500 text-center">
        Your address is kept private and is only used for pickup and delivery.
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-between items-center gap-4 pt-4">
        <button type="button" (click)="back.emit()" class="px-5 py-2.5 rounded-lg bg-transparent text-blue-700 hover:bg-gray-100 font-semibold transition text-sm flex items-center gap-2">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
          Back
        </button>
        <button type="submit" class="px-5 py-2.5 rounded-lg bg-blue-600 text-white hover:bg-blue-700 font-semibold transition shadow text-sm">Confirm Order</button>
      </div>
    </form>
  </div>
</div>
