<div class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
  <div class="bg-white rounded-2xl shadow-lg max-w-md w-full mx-4 overflow-hidden transform transition-all">
    
    <!-- Header -->
    <div class="bg-blue-500 py-4 px-6 rounded-t-2xl">
      <div class="flex justify-between items-center">
        <h3 class="text-xl font-medium text-white">Order Feedback</h3>
        <button 
          (click)="onCancel()" 
          class="text-white hover:text-gray-200 transition-colors focus:outline-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <p class="text-blue-100 text-xs mt-1">Order #{{ orderId }}</p>
    </div>

    <!-- Star Rating -->
    <div class="px-6 pt-5">
      <div class="text-center mb-3">
        <p class="text-sm text-gray-600 mb-2">How was your experience?</p>
        <div class="flex justify-center space-x-1">
          <ng-container *ngFor="let star of starsArray">
            <button 
              (click)="setRating(star)" 
              (mouseenter)="setHoveredStar(star)" 
              (mouseleave)="clearHoveredStar()"
              class="focus:outline-none transition-transform"
              [class.transform]="hoveredStar >= star || feedback.rating >= star"
              [class.scale-110]="hoveredStar >= star || feedback.rating >= star">
              <svg 
                class="w-7 h-7 transition-colors duration-200" 
                [ngClass]="{
                  'text-yellow-400 fill-current': hoveredStar >= star || feedback.rating >= star,
                  'text-white': hoveredStar < star && feedback.rating < star
                }"
                xmlns="http://www.w3.org/2000/svg" 
                viewBox="0 0 24 24">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
              </svg>
            </button>
          </ng-container>
        </div>
      </div>
    </div>

    <!-- Feedback Text Area -->
    <div class="px-6 pt-3 pb-5">
      <label class="block text-sm font-medium text-gray-700 mb-1">Share your thoughts</label>
      <textarea 
        [(ngModel)]="feedback.description" 
        rows="4" 
        class="block w-full rounded-lg border border-gray-300 bg-white text-sm placeholder-gray-400 py-2 px-3 focus:outline-none focus:border-gray-300 focus:ring-1 focus:ring-gray-300 transition"
        placeholder="Tell us what you liked or what could be improved..."></textarea>
      
      <div *ngIf="error" class="mt-2 text-sm text-red-600">{{ error }}</div>

      <div class="mt-5 flex justify-end space-x-3">
        <button 
          type="button" 
          (click)="onCancel()"
          class="rounded-lg border border-gray-300 bg-white py-2 px-4 text-sm text-gray-700 hover:bg-gray-100 transition focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-offset-1">
          Cancel
        </button>
        <button 
          type="button" 
          [disabled]="isSubmitting"
          (click)="submitFeedback()"
          class="rounded-lg bg-blue-500 py-2 px-4 text-sm font-medium text-white shadow-sm hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1 disabled:opacity-60 flex items-center">
          <span *ngIf="isSubmitting" class="mr-2">
            <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </span>
          Submit Feedback
        </button>
      </div>
    </div>
  </div>
</div>
