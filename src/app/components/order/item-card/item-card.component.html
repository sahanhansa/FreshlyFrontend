<div class="bg-white p-6 rounded-lg border border-gray-200 shadow-lg flex flex-col items-center text-center max-w-sm w-full">
  <!-- Increased Image Size -->
  <img [src]="item.image" alt="{{ item.name }}" class="w-32 h-32 mb-4 object-contain">

  <!-- Name and Price Side by Side -->
  <div class="flex justify-between items-center w-full mb-2">
    <h3 class="text-2xl font-semibold text-gray-900">{{ item.name }}</h3>
    <p class="text-lg text-yellow-500 font-bold">Rs.{{ item.price }}</p>
  </div>

  <!-- Description -->
  <p class="text-gray-600 text-sm mb-1">{{ item.description }}</p>

  <!-- Garment Type -->
  <div class="mt-1 w-full flex flex-col md:flex-row items-center gap-2">
    <label class="text-sm font-medium text-gray-700 w-full md:w-1/2 text-left">Garment Type</label>
    <select [formControl]="selectedGarment" class="w-full md:w-1/2 shadow-md p-1 rounded text-sm">
      <option *ngFor="let type of garmentTypes">{{ type }}</option>
    </select>
  </div>

  <!-- Wash Method -->
  <div class="mt-1 w-full flex flex-col md:flex-row items-center gap-2">
    <label class="text-sm font-medium text-gray-700 w-full md:w-1/2 text-left">Wash Method</label>
    <select [formControl]="selectedWashMethod" class="w-full md:w-1/2 shadow-md p-1 rounded text-sm">
      <option *ngFor="let method of washMethods">{{ method }}</option>
    </select>
  </div>

  <!-- Quantity Input Field -->
  <div class="mt-1 w-full flex flex-col md:flex-row items-center gap-2">
    <label class="text-sm font-medium text-gray-700 w-full md:w-1/2 text-left">Quantity</label>
    <input
      type="number"
      [formControl]="selectedQuantity"
      min="1"
      class="w-full md:w-1/2 shadow-md p-1 text-sm rounded focus:outline-none focus:ring-1 "
    />
  </div>

  <!-- Add to Basket Button -->
  <button class="bg-blue-500 text-white px-4 py-2 mt-4 rounded-lg flex items-center w-full justify-center">
    <span>Add to Basket</span>
  </button>
</div>
