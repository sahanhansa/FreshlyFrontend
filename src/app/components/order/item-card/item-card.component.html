<div
  class="bg-white p-6 rounded-lg shadow-lg flex flex-col items-center text-center max-w-sm w-full transform transition-transform duration-300 hover:scale-105 hover:shadow-xl"
>
  <!-- Increased Image Size -->
  <img [src]="item.imageUrl" alt="{{ item.name }}" class="w-32 h-32 mb-4 object-contain">

  <!-- Name and Price Side by Side -->
  <div class="flex justify-between items-center w-full mb-2">
    <h3 class="text-xl font-semibold text-gray-900">{{ item.itemName || item.name }}</h3>
    <p class="text-lg text-yellow-500 font-bold">Rs.{{ currentPrice }}</p>
  </div>

  <!-- Description -->
  <p class="text-gray-600 text-sm mb-1">This is a {{ item.categoryName }} item</p>

  <!-- Fabric Type Selection dropdown -->
  <div class="mt-1 w-full flex flex-col md:flex-row items-center gap-2">
    <label class="text-sm font-medium text-gray-700 w-full md:w-1/2 text-left">Fabric Type</label>
    <select [formControl]="selectedGarment"  class="w-full md:w-1/2 shadow-md p-1 rounded text-sm">
      <option *ngFor="let type of fabricTypes" [value]="type.garmentTypeId">{{ type?.garmentTypeName }}</option>
    </select>
  </div>

  <!-- Service Type Selection dropdown -->
  <div class="mt-2 w-full flex flex-col md:flex-row items-center gap-2">
    <label class="text-sm font-medium text-gray-700 w-full md:w-1/2 text-left">Service Type</label>
    <select [formControl]="selectedService" class="w-full md:w-1/2 shadow-md p-1 rounded text-sm ">
      <option *ngFor="let service of serviceTypes" [value]="service.serviceId">
        {{ service?.serviceName }}
      </option>
    </select>
  </div>

  <!-- Quantity -->
  <div class="mt-2 w-full flex flex-col md:flex-row items-center gap-2">
    <label class="text-sm font-medium text-gray-700 w-full md:w-1/2 text-left">Quantity</label>
    <input type="number" [formControl]="quantity" min="1" class="w-full md:w-1/2 shadow-md p-1 rounded text-sm">
  </div>

  <!-- Add to Basket Button with loading and success states -->
  <button 
    (click)="onAddToBasket()" 
    [disabled]="isAddingToBasket"
    class="mt-4 bg-blue-500 text-white px-4 py-2 rounded-lg flex items-center w-full justify-center hover:bg-blue-600 transition"
    [ngClass]="{
      'bg-blue-300': isAddingToBasket
    }"
  >
    <span *ngIf="isAddingToBasket">
      <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
    </span>
    <span *ngIf="!isAddingToBasket">
      Add to Basket
    </span>
  </button>
</div>
