
   
<div class="flex flex-col items-center px-4">
  <!-- Top Bar: Categories (left) and Filters (right) -->
  <div class="w-full flex flex-wrap items-center justify-between mt-4 mb-4">
    <!-- Categories on the left -->
    <div class="flex space-x-2 items-center">
      <button 
        class="px-4 py-2 rounded-full border transition-all text-sm font-medium"
        [ngClass]="{'bg-[#0A84FF] text-white': selectedCategory === 'All', 'bg-gray-200 text-gray-700': selectedCategory !== 'All'}"
        (click)="setCategory('All')"
      >All</button>
      <button 
        *ngFor="let category of categories"
        class="px-4 py-2 rounded-full border transition-all text-sm font-medium"
        [ngClass]="{'bg-[#0A84FF] text-white': selectedCategory === category, 'bg-gray-200 text-gray-700': selectedCategory !== category}"
        (click)="setCategory(category)"
      >{{ category }}</button>
    </div>
    <!-- Filters on the right -->
    <div class="flex flex-wrap gap-4 items-center">
      <!-- A-Z Sort -->
      <button (click)="setSortAZ(!sortAZ)" [ngClass]="sortAZ ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700'" class="px-4 py-2 rounded-md font-medium shadow">
        Sort A-Z
      </button>
      <!-- Service Filter -->
      <div class="relative">
        <button 
          (click)="toggleServiceDropdown()"
          class="px-4 py-2 bg-white hover:bg-gray-50 text-gray-700 rounded-md font-medium shadow flex items-center justify-between min-w-[150px] transition duration-200"
        >
          <span class="flex-1 text-left">{{ selectedService }}</span>
          <span class="flex items-center h-full ml-2">
            <svg class="w-4 h-4 transition-transform duration-200" [class.rotate-180]="isServiceDropdownOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </span>
        </button>
        <!-- Service Dropdown Menu -->
        <div 
          *ngIf="isServiceDropdownOpen"
          class="absolute top-full left-0 mt-1 bg-white border border-gray-200 rounded-md shadow-md z-10 min-w-full"
        >
          <button 
            (click)="selectService('All')"
            class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 first:rounded-t-md last:rounded-b-md transition"
            [class.bg-blue-50]="selectedService === 'All'"
            [class.text-blue-600]="selectedService === 'All'"
            [class.font-medium]="selectedService === 'All'"
          >
            All Services
          </button>
          <button 
            *ngFor="let service of availableServices"
            (click)="selectService(service)"
            class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 first:rounded-t-md last:rounded-b-md transition"
            [class.bg-blue-50]="selectedService === service"
            [class.text-blue-600]="selectedService === service"
            [class.font-medium]="selectedService === service"
          >
            {{ service }}
          </button>
        </div>
      </div>
    </div>
  </div>
  <hr class="w-full mb-4" />
  <!-- Loading State -->
  <div *ngIf="loading" class="flex-1 flex items-center justify-center mb-8 mt-6"> <!-- mb-8 for space below spinner -->
    <div class="text-center">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
      <p class="mt-2 text-gray-600">Loading items...</p>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="flex items-center justify-center mt-10">
    <div class="text-red-600 text-lg">{{ error }}</div>
  </div>

  <!-- Item Grid -->
  <div *ngIf="!loading && !error" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mt-4">
    <app-laundry-item-card 
      *ngFor="let item of paginatedItems" 
      [item]="item"
    />
  </div>

  <!-- No Items Message -->
  <div *ngIf="!loading && !error && allItems.length === 0" class="flex items-center justify-center mt-10">
    <div class="text-lg text-gray-600">No items found. Add some items to get started!</div>
  </div>

  <!-- Pagination -->
  <app-pagination
    [currentPage]="currentPage"
    [totalItems]="filteredItems.length"
    (pageChange)="onPageChange($event)"
  ></app-pagination>
</div>
