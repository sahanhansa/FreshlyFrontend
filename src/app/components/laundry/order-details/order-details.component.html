<div class="order-details">
  <div class="order-header">
    <h2>Order Details</h2>
    <p><strong>Order ID:</strong> {{ order.orderId }}</p>
    <p><strong>Customer Name:</strong> {{ order.customerName }}</p>
  </div>
  <div class="services">
    <h3>Services</h3>
    <table>
      <thead>
        <tr>
          <th>Item Name</th>
          <th>Quantity</th>
          <th>Unit Price</th>
          <th>Total Amount</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let service of order.services">
          <td>{{ service.itemName }}</td>
          <td>{{ service.quantity }}</td>
          <td>{{ service.unitPrice | currency }}</td>
          <td>{{ service.totalAmount | currency }}</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="order-actions" *ngIf="order.status === 'picked up'">
    <button class="start-processing-btn">Start Processing</button>
  </div>
</div>
