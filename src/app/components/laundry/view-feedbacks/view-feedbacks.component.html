<div class="max-w-4xl mx-auto px-4 py-8 space-y-6" *ngIf="feedbacks.length">
  <div
    *ngFor="let feedback of feedbacks; let i = index"
    class="border rounded-xl p-4 bg-white shadow-sm"
  >
    <h3 class="font-semibold text-lg text-black">
      {{ feedback.customerFName }} {{ feedback.customerLName }}
    </h3>

    <p class="text-black mt-1 mb-3">{{ feedback.description }}</p>

    <div class="flex items-center justify-between">
      <div class="text-yellow-400">
        <ng-container *ngFor="let star of [1,2,3,4,5]; let j = index">
          <span
            [class.text-yellow-400]="j < feedback.rating"
            [class.text-gray-300]="j >= feedback.rating"
          >★</span>
        </ng-container>
      </div>

      <button
        class="text-white text-sm px-4 py-1.5 rounded-md hover:opacity-90"
        style="background-color: #0A84FF;"
        (click)="toggleReply(i)"
      >
        Reply
      </button>
    </div>

    <!-- Reply form section -->
    <div *ngIf="feedback.showReply" class="mt-3 space-y-2">
      <textarea
        [(ngModel)]="feedback.replyText"
        name="replyText{{ i }}"
        rows="3"
        class="w-full border rounded-md p-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
        placeholder="Write your reply..."
      ></textarea>

      <div class="flex justify-end gap-2">
        <button
          class="text-sm px-3 py-1.5 bg-gray-200 rounded-md hover:bg-gray-300"
          (click)="toggleReply(i)"
        >
          Cancel
        </button>
        <button
          class="text-white text-sm px-4 py-1.5 rounded-md hover:opacity-90"
          style="background-color: black;"
          (click)="submitReply(i)"
        >
          Send
        </button>
      </div>
    </div>
  </div>
</div>
