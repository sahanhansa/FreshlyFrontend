<div class="max-w-4xl mx-auto px-4 py-2 space-y-6" *ngIf="feedbacks.length">
  <div
    *ngFor="let feedback of feedbacks; let i = index"
    class="border rounded-xl p-4 bg-white shadow-sm"
  >
    <h3 class="font-semibold text-lg text-black">
      {{ feedback.customerName || (feedback.customerFName + ' ' + feedback.customerLName) }}
    </h3>

    <p class="text-black mt-1 mb-3">{{ feedback.description }}</p>

    <div class="flex items-center justify-between">
      <div class="text-yellow-400">
        <ng-container *ngFor="let star of [1,2,3,4,5]; let j = index">
          <span
            [class.text-yellow-400]="j < feedback.rating"
            [class.text-gray-300]="j >= feedback.rating"
          >★</span>
        </ng-container>
      </div>
      <div class="flex gap-2">
      <button
        class="text-white text-sm px-4 py-1.5 rounded-md hover:opacity-90"
        style="background-color: #0A84FF;"
          (click)="viewOrder(feedback)"
      >
          View Order
      </button>
        <button
          *ngIf="!feedback.read"
          class="text-white text-sm px-4 py-1.5 rounded-md hover:opacity-90 bg-gray-600"
          (click)="markAsReadAndMove(feedback, i)"
        >
          Mark as Read
        </button>
        <button
          *ngIf="feedback.read"
          class="text-white text-sm px-4 py-1.5 rounded-md bg-green-500 cursor-default"
          disabled
        >
          Read
        </button>
      </div>
    </div>
  </div>
</div>
