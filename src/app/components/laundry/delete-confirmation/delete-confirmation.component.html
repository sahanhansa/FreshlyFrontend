<div class="flex flex-col items-center justify-center rounded-xl shadow-md border border-gray-300 px-4 sm:px-6 md:px-8 py-6 sm:py-8 text-base sm:text-lg max-w-xs sm:max-w-md md:max-w-lg mx-auto mt-10">
  <div class="flex items-center mb-6 sm:mb-8 text-red-500">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 sm:w-20 sm:h-20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M12 2a10 10 0 100 20 10 10 0 000-20z" />
    </svg>
  </div>

  <h2 class="text-xl sm:text-2xl font-semibold text-gray-800 mb-3 sm:mb-4 text-center">
    {{ title }}
  </h2>

  <p class="text-gray-600 mb-6 sm:mb-8 text-center px-2">
    {{ message }}
  </p>

  <div class="flex space-x-6">
    <button 
      (click)="onDeleteConfirm()" 
      class="border border-blue-500 text-blue-500 font-medium py-2 px-6 sm:px-8 rounded-full transition-colors text-sm sm:text-base cursor-pointer hover:bg-blue-500 hover:text-white">
      {{ button1Text }}
    </button>

    <button 
      class="border border-blue-500 text-blue-500 font-medium py-2 px-6 sm:px-8 rounded-full transition-colors text-sm sm:text-base cursor-pointer hover:bg-blue-500 hover:text-white">
      {{ button2Text }}
    </button>
  </div>
</div>
