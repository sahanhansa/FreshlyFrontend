<div class="min-h-screen flex items-center justify-center p-6 bg-gray-100">
  <div class="w-full max-w-md bg-white rounded-xl p-8 shadow-lg">
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-gray-800 mb-2">Delete Item</h2>
      <p class="text-gray-600">Are you sure you want to delete this item?</p>
    </div>

    <!-- Item Details -->
    <div class="bg-gray-50 rounded-lg p-4 mb-6">
      <p class="text-sm text-gray-600 mb-1">Item to delete:</p>
      <p class="font-semibold text-gray-800">{{ itemName || 'Unknown Item' }}</p>
    </div>

    <!-- Warning Message -->
    <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
      <p class="text-sm text-red-700">
        <strong>Warning:</strong> This action cannot be undone. The item will be permanently removed from your inventory.
      </p>
    </div>

    <!-- Buttons -->
    <div class="flex flex-col sm:flex-row gap-3">
      <button 
        (click)="onCancel()"
        [disabled]="isDeleting"
        class="flex-1 px-4 py-3 bg-gray-200 text-gray-800 rounded-lg font-medium hover:bg-gray-300 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Cancel
      </button>
      <button 
        (click)="onConfirm()"
        [disabled]="isDeleting"
        class="flex-1 px-4 py-3 bg-red-600 text-white rounded-lg font-medium hover:bg-red-700 transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center"
      >
        <span *ngIf="!isDeleting">Delete Item</span>
        <span *ngIf="isDeleting" class="flex items-center">
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Deleting...
        </span>
      </button>
    </div>

    <!-- Back Link -->
    <div class="text-center mt-6">
      <button 
        (click)="onBack()"
        class="text-blue-600 hover:text-blue-800 text-sm font-medium"
      >
        ← Back to Items
      </button>
    </div>
  </div>
</div>
