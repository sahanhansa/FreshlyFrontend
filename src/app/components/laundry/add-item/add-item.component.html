<div *ngIf="successMessage" class="fixed inset-0 flex items-center justify-center z-50 bg-black bg-opacity-30">
  <div class="bg-white border-2 border-green-400 text-green-700 px-10 py-8 rounded-2xl shadow-2xl flex flex-col items-center animate-bounce-in">
    <div class="flex items-center justify-center mb-4">
      <svg class="w-16 h-16 text-green-500 animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="#e6ffed"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12l3 3 5-5" stroke-width="3" />
      </svg>
    </div>
    <div class="text-2xl font-bold mb-2 text-green-700">Success!</div>
    <div class="text-lg mb-4 text-gray-700">{{ successMessage }}</div>
    <button (click)="goBackToItems()" class="mt-2 px-8 py-2 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition text-lg font-semibold shadow">Go Back to Items</button>
  </div>
</div>
<div class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-3xl bg-blue-100 rounded-xl p-6 shadow-lg">
    <div class="flex flex-col items-center mb-6">
      <!-- Image Upload -->
      <div class="w-36 h-36 rounded-full bg-white flex items-center justify-center shadow-md mb-2 relative">
        <img *ngIf="imageUrl && !isImageUploading" [src]="imageUrl" alt="Item Image" class="w-28 h-28 rounded-full object-cover" />
        <div *ngIf="!imageUrl && !isImageUploading" class="text-gray-400 text-sm">No image</div>
        <div *ngIf="isImageUploading" class="text-blue-500 text-sm">Uploading...</div>
        <input type="file" #fileInput accept="image/*" (change)="onImageSelected($event)" class="hidden" [disabled]="isImageUploading" />
        <button type="button" class="absolute bottom-1 right-1 bg-black bg-opacity-60 text-white text-xs px-2 py-1 rounded-full" (click)="fileInput.click()" [disabled]="isImageUploading">
          {{ isImageUploading ? 'Uploading...' : 'Add Image' }}
        </button>
      </div>

      <!-- Form -->
      <form (submit)="onSubmit()" class="bg-white p-6 rounded-xl w-full space-y-4 mt-5">
        <div *ngIf="errorMessage" class="mb-4 px-4 py-3 rounded-lg bg-red-100 border border-red-400 text-red-700 text-center font-semibold">
          {{ errorMessage }}
        </div>
        <div>
          <label class="block text-gray-600">Item Name</label>
          <input type="text" [(ngModel)]="itemName" name="itemName" required class="w-full mt-1 p-2 border rounded-md" />
        </div>

        <div>
          <label class="block text-gray-600">Description</label>
          <textarea [(ngModel)]="description" name="description" class="w-full mt-1 p-2 border rounded-md"></textarea>
        </div>

        <div>
          <label class="block text-gray-600">Category</label>
          <select [(ngModel)]="selectedCategory" name="selectedCategory" (change)="onCategoryChange()" required class="w-full mt-1 p-2 border rounded-md bg-white cursor-pointer">
            <option *ngFor="let category of categories" [value]="category">
              {{ category }}
            </option>
          </select>
        </div>

        <!-- Material Types Input -->
        <div class="mt-6">
          <label class="block text-gray-600">Material Types *</label>
          <div class="flex gap-2 mt-1">
            <input type="text" [(ngModel)]="materialInput" name="materialInput" placeholder="Enter material type..." class="flex-1 p-2 border rounded-md" (keyup.enter)="addMaterial()" />
            <button type="button" (click)="addMaterial()" class="bg-gray-200 px-4 py-2 rounded-md text-gray-700">Add</button>
          </div>
          <div class="mt-2">
            <span class="block text-gray-500 text-sm">Enter the material types for this item (e.g., cotton)</span>
          </div>
          <!-- Selected Materials Chips -->
          <div class="mt-2 flex flex-wrap gap-2">
            <span *ngFor="let mat of materials" class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm flex items-center">
              {{ mat }}
              <button type="button" (click)="removeMaterial(mat)" class="ml-2 text-blue-500 hover:text-blue-700">&times;</button>
            </span>
          </div>
        </div>

        <!-- Services & Pricing for Each Material -->
        <div *ngIf="materials.length > 0" class="mt-8 space-y-8">
          <div *ngFor="let mat of materials" class="bg-white rounded-xl shadow p-6">
            <div class="flex items-center mb-2">
              <span class="inline-block bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-base font-semibold mr-2">
                {{ mat }}
              </span>
              <span class="text-gray-500 text-sm">Configure services for this material</span>
            </div>
            <div class="space-y-3 mt-4">
              <div *ngFor="let service of materialServices[mat]; let i = index" class="flex gap-2 items-center">
                <span class="flex-1">{{ service.serviceName }}</span>
                <input type="number" [(ngModel)]="materialServices[mat][i].price" [name]="mat + '_service_' + i + '_price'" placeholder="0.00" class="w-28 p-2 border rounded-md text-right" />
                <button type="button" (click)="removeMaterialService(mat, i)" *ngIf="materialServices[mat].length > 1" class="text-red-500 hover:text-red-700 px-2">
                  <svg xmlns='http://www.w3.org/2000/svg' class='h-5 w-5' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M6 18L18 6M6 6l12 12'/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="flex justify-end pt-4">
          <button type="submit" [disabled]="isSubmitting" class="bg-blue-600 text-white px-4 py-2 rounded-full flex items-center justify-center min-w-[110px]">
            <ng-container *ngIf="isSubmitting; else addText">
              <svg class="animate-spin h-5 w-5 mr-2 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
              </svg>
              Adding...
            </ng-container>
            <ng-template #addText>Add Item</ng-template>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
@keyframes bounce-in {
  0% { transform: scale(0.8); opacity: 0; }
  60% { transform: scale(1.05); opacity: 1; }
  80% { transform: scale(0.97); }
  100% { transform: scale(1); }
}
.animate-bounce-in {
  animation: bounce-in 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}
</style>
