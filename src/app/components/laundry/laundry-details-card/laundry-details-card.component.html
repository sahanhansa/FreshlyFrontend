<div class="border-0 rounded-lg shadow-none h-full max-w-l flex flex-col bg-transparent">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex items-center justify-center h-full">
    <div class="text-center">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto"></div>
      <p class="mt-4 text-gray-600">Loading laundry details...</p>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !isLoading" class="flex items-center justify-center h-full">
    <div class="text-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-red-500 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z" />
      </svg>
      <p class="text-red-600">{{ error }}</p>
    </div>
  </div>

  <!-- Content -->
  <div *ngIf="!isLoading && !error && laundry">

  <!-- Details Section with Enhanced Design -->
  <div class="p-6 text-sm space-y-5 flex-grow bg-white min-h-0 rounded-lg">
    <!-- Laundry ID Card -->
    <div class="bg-gray-50 rounded-xl p-5 border border-gray-200 hover:border-blue-300 hover:shadow-sm transition-all duration-200">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-blue-500 rounded-xl flex items-center justify-center shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 3H5a2 2 0 00-2 2v5m0 4v5a2 2 0 002 2h5m4 0h5a2 2 0 002-2v-5m0-4V5a2 2 0 00-2-2h-5" />
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-semibold text-gray-800 text-base mb-1">Laundry ID</p>
          <p class="text-gray-600 font-mono text-sm break-words">{{ laundry.laundryId }}</p>
        </div>
      </div>
    </div>

    <!-- Address Card -->
    <div class="bg-gray-50 rounded-xl p-5 border border-gray-200 hover:border-green-300 hover:shadow-sm transition-all duration-200">
      <div class="flex items-start gap-4">
        <div class="w-12 h-12 bg-green-500 rounded-xl flex items-center justify-center shadow-sm mt-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-semibold text-gray-800 text-base mb-1">Address</p>
          <p class="text-gray-600 text-sm leading-relaxed">{{ laundry.address }}</p>
        </div>
      </div>
    </div>

    <!-- Contact Card -->
    <div class="bg-gray-50 rounded-xl p-5 border border-gray-200 hover:border-purple-300 hover:shadow-sm transition-all duration-200">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-purple-500 rounded-xl flex items-center justify-center shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-semibold text-gray-800 text-base mb-1">Contact Number</p>
          <p class="text-gray-600 text-sm">{{ laundry.contactNumber }}</p>
        </div>
      </div>
    </div>

    <!-- Email Card -->
    <div class="bg-gray-50 rounded-xl p-5 border border-gray-200 hover:border-orange-300 hover:shadow-sm transition-all duration-200">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 bg-orange-500 rounded-xl flex items-center justify-center shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-semibold text-gray-800 text-base mb-1">Email Address</p>
          <p class="text-gray-600 break-words text-sm">{{ laundry.email }}</p>
        </div>
      </div>
    </div>
  </div>
  </div>
</div>
