<div class="flex flex-col items-center justify-center rounded-xl shadow-md border border-gray-300 px-4 sm:px-6 md:px-8 py-6 sm:py-8 text-base sm:text-lg max-w-xs sm:max-w-md md:max-w-lg mx-auto mt-10">
  <div class="flex items-center mb-6 sm:mb-8">
    <img src="assets/successLogo.png" alt="Success Icon" class="w-16 h-16 sm:w-20 sm:h-20">
  </div>

  <h2 class="text-xl sm:text-2xl font-semibold text-gray-800 mb-3 sm:mb-4 text-center">
    {{ title }}
  </h2>

  <p class="text-gray-600 mb-6 sm:mb-8 text-center px-2">
    {{ message }}
  </p>

  <button [routerLink]="['/new-orders']"
    class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-6 sm:px-8 rounded-full transition-colors text-sm sm:text-base">
    {{ buttonText }}
  </button>
</div>
