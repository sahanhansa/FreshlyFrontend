<div class="flex flex-col items-center justify-center rounded-xl shadow-md border border-gray-300 px-8 py-8 text-lg max-w-md mx-auto mt-10">
  <div class="flex items-center mb-8">
    <img src="assets/successLogo.png" alt="Success Icon">
  </div>

  <h2 class="text-2xl font-semibold text-gray-800 mb-4 text-center">{{ title }}</h2>

  <p class="text-gray-600 mb-8 text-center">
    {{ message }}
  </p>

  <button 
  [routerLink]="orderType === 'regular' ? '/regular-order' : '/express-order'"
  class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-8 rounded-full transition-colors">
  {{ buttonText }}
</button>

</div>
