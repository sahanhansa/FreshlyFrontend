<div *ngIf="successMessage" class="fixed inset-0 flex items-center justify-center z-50 bg-black bg-opacity-30">
  <div class="bg-white border-2 border-green-400 text-green-700 px-10 py-8 rounded-2xl shadow-2xl flex flex-col items-center animate-bounce-in">
    <div class="flex items-center justify-center mb-4">
      <svg class="w-16 h-16 text-green-500 animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="#e6ffed"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12l3 3 5-5" stroke-width="3" />
      </svg>
    </div>
    <div class="text-2xl font-bold mb-2 text-green-700">Success!</div>
    <div class="text-lg mb-4 text-gray-700">{{ successMessage }}</div>
    <div class="flex gap-3">
      <button (click)="goBackToItems()" class="mt-2 px-6 py-2 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition text-lg font-semibold shadow">Done Editing</button>
      <button (click)="successMessage = ''" class="mt-2 px-6 py-2 bg-gray-500 text-white rounded-full hover:bg-gray-600 transition text-lg font-semibold shadow">Continue Editing</button>
    </div>
  </div>
</div>
<div class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-3xl bg-blue-100 rounded-xl p-6 shadow-lg">
    <!-- Image and Title -->
<div class="flex flex-col items-center mb-6">
  <!-- Circle image frame -->
  <div class="w-36 h-36 rounded-full bg-white flex items-center justify-center shadow-md mb-2 relative">
    <img [src]="imageUrl" alt="Item Image" class="w-28 h-28 rounded-full object-cover" />

    <!-- Hidden file input -->
    <input type="file" #fileInput accept="image/*" (change)="onImageSelected($event)" class="hidden" />

    <!-- Edit button over image -->
    <button type="button"
      class="absolute bottom-1 right-1 bg-black bg-opacity-60 text-white text-xs px-2 py-1 rounded-full"
      (click)="fileInput.click()">
      Edit
    </button>
  </div>

    <!-- Form -->
    <form class="bg-white p-6 rounded-xl w-full space-y-4">
      <!-- Loading indicator -->
      <div *ngIf="loading" class="text-center py-4">
        <div class="text-blue-600 text-sm">Loading item details...</div>
      </div>
      

      <!-- Item Name -->
      <div>
        <label class="block text-gray-600">Item Name</label>
        <input type="text" [(ngModel)]="item.name" name="name"
               class="w-full mt-1 p-2 border rounded-md" />
      </div>

      <!-- Description -->
      <div>
        <label class="block text-gray-600">Description</label>
        <textarea [(ngModel)]="item.description" name="description"
                  placeholder="Enter item description..."
                  class="w-full mt-1 p-2 border rounded-md"></textarea>
      </div>

      <!-- Category -->
      <div>
        <label class="block text-gray-600">Category</label>
        <div class="relative">
          <button 
            type="button"
            (click)="toggleCategoryDropdown()"
            class="w-full mt-1 p-2 border rounded-md bg-white cursor-pointer flex items-center justify-between hover:bg-gray-50 transition duration-200"
          >
            <span class="flex-1 text-left">{{ getSelectedCategoryText() }}</span>
            <span class="flex items-center h-full ml-2">
              <svg class="w-4 h-4 transition-transform duration-200" [class.rotate-180]="isCategoryDropdownOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </span>
          </button>
          <!-- Category Dropdown Menu -->
          <div 
            *ngIf="isCategoryDropdownOpen"
            class="absolute top-full left-0 mt-1 bg-white border border-gray-200 rounded-md shadow-md z-10 min-w-full w-full"
          >
            <button 
              *ngFor="let category of categories"
              (click)="selectCategory(category)"
              class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 first:rounded-t-md last:rounded-b-md transition"
              [class.bg-blue-50]="item.categoryId === category.id"
              [class.text-blue-600]="item.categoryId === category.id"
              [class.font-medium]="item.categoryId === category.id"
            >
              {{ category.name }}
            </button>
          </div>
        </div>
      </div>

      <!-- Add New Material -->
      <div class="mt-6">
        <label class="block text-gray-600">Add Material</label>
        <div class="flex gap-2 mt-1">
          <input type="text" [(ngModel)]="newMaterialInput" name="newMaterialInput" placeholder="Enter material type..." class="flex-1 p-2 border rounded-md" (keyup.enter)="addMaterial()" [disabled]="isAddingMaterial" />
          <button type="button" (click)="addMaterial()" [disabled]="isAddingMaterial" class="bg-gray-200 px-4 py-2 rounded-md text-gray-700 flex items-center justify-center min-w-[60px]">
            <ng-container *ngIf="isAddingMaterial; else addText">
              <svg class="animate-spin h-4 w-4 mr-2 text-gray-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
              </svg>
              Adding...
            </ng-container>
            <ng-template #addText>Add</ng-template>
          </button>
        </div>
      </div>



      <!-- Garment Types & Services -->
      <div *ngIf="materials.length > 0" class="mt-8 space-y-8">
        <div *ngFor="let mat of materials" class="bg-white rounded-xl shadow p-6">
          <div class="flex items-center mb-2 gap-2">
            <span class="inline-block bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-base font-semibold mr-2">
              {{ materialNames[mat] }}
            </span>
            <button type="button" (click)="removeMaterial(mat)" class="text-red-500 hover:text-red-700 px-2" title="Delete Material">
              <svg xmlns='http://www.w3.org/2000/svg' class='h-5 w-5' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M6 18L18 6M6 6l12 12'/></svg>
            </button>
            <span class="text-gray-500 text-sm">Configure services for this material</span>
          </div>
          <div class="space-y-3 mt-4">
            <div *ngFor="let service of materialServices[mat]; let i = index" class="flex gap-2 items-center">
              <span class="flex-1">{{ service.serviceName }}</span>
              <input type="number" [(ngModel)]="materialServices[mat][i].price" [name]="mat + '_service_' + i + '_price'" placeholder="$0.00" class="w-28 p-2 border rounded-md text-right" />
              <button type="button" (click)="removeServiceFromGarment(mat, i)" class="text-red-500 hover:text-red-700 px-2" *ngIf="materialServices[mat].length > 1">
                <svg xmlns='http://www.w3.org/2000/svg' class='h-5 w-5' fill='none' viewBox='0 0 24 24' stroke='currentColor'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M6 18L18 6M6 6l12 12'/></svg>
              </button>
            </div>
            <!-- Add Service Row -->
            <div class="flex gap-2 items-center mt-2" *ngIf="materialServices[mat].length < 4">
              <div class="relative flex-1">
                <button 
                  type="button"
                  (click)="toggleServiceDropdown(mat)"
                  class="w-full p-2 rounded-md bg-white shadow focus:outline-none flex items-center justify-between hover:bg-gray-50 transition duration-200"
                  style="box-shadow: 0 2px 8px rgba(0,0,0,0.08);"
                >
                  <span class="flex-1 text-left">{{ getSelectedServiceText(mat) }}</span>
                  <span class="flex items-center h-full ml-2">
                    <svg class="w-4 h-4 transition-transform duration-200" [class.rotate-180]="isServiceDropdownOpen[mat]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                  </span>
                </button>
                <!-- Service Dropdown Menu -->
                <div 
                  *ngIf="isServiceDropdownOpen[mat]"
                  class="absolute top-full left-0 mt-1 bg-white border border-gray-200 rounded-md shadow-md z-10 min-w-full w-full"
                >
                  <button 
                    type="button"
                    *ngFor="let service of getAvailableServicesForMaterial(mat)"
                    (click)="selectService(mat, service)"
                    class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 first:rounded-t-md last:rounded-b-md transition"
                  >
                    {{ service }}
                  </button>
                </div>
              </div>
              <button type="button"
                      class="bg-gray-200 px-4 py-2 rounded-md text-gray-700"
                      [disabled]="true">
                Add
              </button>
            </div>
          </div>
        </div>
      </div>


      <!-- Buttons -->
      <div class="flex justify-between pt-4">
        <button 
          type="button" 
          (click)="onRemoveItem()"
          class="bg-red-600 text-white px-4 py-2 rounded-full hover:bg-red-700 transition duration-200"
        >
          Remove Item
        </button>

        <button type="button" (click)="onSubmit()" [disabled]="isSubmitting || isAnyServiceIdLoading() || !hasMinimumRequirements()" class="bg-blue-600 text-white px-4 py-2 rounded-full hover:bg-blue-700 transition duration-200 flex items-center justify-center min-w-[120px]">
          <ng-container *ngIf="isSubmitting || isAnyServiceIdLoading(); else updateText">
            <svg class="animate-spin h-5 w-5 mr-2 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
            </svg>
            {{ isAnyServiceIdLoading() ? 'Loading services...' : 'Updating Item...' }}
          </ng-container>
          <ng-template #updateText>Update Item</ng-template>
        </button>
      </div>
    </form>
  </div>
</div>

<style>
@keyframes bounce-in {
  0% { transform: scale(0.8); opacity: 0; }
  60% { transform: scale(1.05); opacity: 1; }
  80% { transform: scale(0.97); }
  100% { transform: scale(1); }
}
.animate-bounce-in {
  animation: bounce-in 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
}
</style>
