<div class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-3xl bg-blue-100 rounded-xl p-6 shadow-lg">
    <!-- Image and Title -->
<div class="flex flex-col items-center mb-6">
  <!-- Circle image frame -->
  <div class="w-36 h-36 rounded-full bg-white flex items-center justify-center shadow-md mb-2 relative">
    <img [src]="imageUrl" alt="Item Image" class="w-28 h-28 rounded-full object-cover" />

    <!-- Hidden file input -->
    <input type="file" #fileInput accept="image/*" (change)="onImageSelected($event)" class="hidden" />

    <!-- Edit button over image -->
    <button type="button"
      class="absolute bottom-1 right-1 bg-black bg-opacity-60 text-white text-xs px-2 py-1 rounded-full"
      (click)="fileInput.click()">
      Edit
    </button>
  </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="bg-white p-6 rounded-xl w-full space-y-4">
      <!-- Loading indicator -->
      <div *ngIf="loading" class="text-center py-4">
        <div class="text-blue-600 text-sm">Loading item details...</div>
      </div>
      

      <!-- Item Name -->
      <div>
        <label class="block text-gray-600">Item Name</label>
        <input type="text" [(ngModel)]="item.name" name="name"
               class="w-full mt-1 p-2 border rounded-md" />
      </div>

      <!-- Description -->
      <div>
        <label class="block text-gray-600">Description</label>
        <textarea [(ngModel)]="item.description" name="description"
                  placeholder="Enter item description..."
                  class="w-full mt-1 p-2 border rounded-md"></textarea>
      </div>

      <!-- Category -->
      <div>
        <label class="block text-gray-600">Category</label>
        <select [(ngModel)]="item.categoryName" name="category" 
                class="w-full mt-1 p-2 border rounded-md bg-white cursor-pointer">
          <option value="">Select Category</option>
          <option *ngFor="let category of categories" [value]="category">
            {{ category }}
          </option>
        </select>
      </div>


  <!-- Services -->
<div>
  <label class="block text-gray-600 mb-1">Services</label>
  <div class="space-y-3">
    <div *ngFor="let service of item.services; let i = index" class="flex gap-2 items-center">
      <select [(ngModel)]="service.serviceName" [name]="'service' + i + 'name'" (change)="onServiceChange(i)" required class="flex-1 p-2 border rounded-md bg-white cursor-pointer">
        <option *ngFor="let s of availableServices" [value]="s">{{ s }}</option>
      </select>

      <div class="flex flex-col">
        <label class="text-xs text-gray-500 pl-1">Unit Price</label>
        <input type="number" [(ngModel)]="service.price" [name]="'service' + i + 'price'" placeholder="Price" required class="w-32 p-2 border rounded-md" />
      </div>

      <button type="button" (click)="removeService(i)" class="text-red-500 font-bold px-2 text-lg" *ngIf="item.services.length > 1">✕</button>
    </div>

    <button type="button" (click)="addService()" [disabled]="item.services.length >= 3" class="text-blue-600 underline text-sm">
      + Add Service
    </button>
  </div>
</div>


      <!-- Buttons -->
      <div class="flex justify-between pt-4">
        <button 
          type="button" 
          (click)="onRemoveItem()"
          class="bg-red-600 text-white px-4 py-2 rounded-full hover:bg-red-700 transition duration-200"
        >
          Remove Item
        </button>

        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-full hover:bg-blue-700 transition duration-200">
          Done
        </button>
      </div>
    </form>
  </div>
</div>
