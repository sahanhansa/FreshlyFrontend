<nav class="flex justify-between items-center p-4 shadow-md bg-white fixed top-0 left-0 right-0 z-50">
  <ul class="flex items-center gap-10 list-none m-0 p-0 w-full">
    <li class="logo-container">
      <a routerLink="/whoareyou" class="cursor-pointer">
        <img [src]="logoUrl" alt="Freshly Logo" class="h-10 w-auto">
      </a>
    </li>
    <li *ngFor="let tab of tabs">
      <a [routerLink]="tab.path" 
         routerLinkActive="font-semibold text-blue-600"
         [routerLinkActiveOptions]="{exact: true}"
         class="text-gray-900 hover:text-blue-600 hover:font-medium transition-all duration-200 text-base px-2 py-1">
        {{tab.label}}
      </a>
    </li>
  </ul>
</nav>
