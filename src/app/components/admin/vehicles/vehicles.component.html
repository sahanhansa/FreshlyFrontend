<div class="p-8 bg-gray-100 min-h-screen">
  <!-- Header Controls -->
  <div class="flex justify-between items-center mb-8 bg-white p-4 rounded-lg shadow-sm">
    <div class="flex items-center gap-2">
      <span>Show</span>
      <select [(ngModel)]="itemsPerPage" 
              class="px-3 py-1 mx-2 border border-gray-200 rounded outline-none focus:border-blue-500"
              #entriesSelect (change)="onEntriesChange(+entriesSelect.value)">
        <option value="9">9</option>
        <option value="25">25</option>
        <option value="50">50</option>
      </select>
      <span>entries</span>
    </div>
    <div>
      <input type="text" [(ngModel)]="searchQuery" placeholder="Search..." (input)="onSearch(searchQuery)"
             class="px-4 py-2 border border-gray-200 rounded outline-none w-60 focus:border-blue-500">
    </div>
  </div>

  <h1 class="text-4xl text-gray-800 mb-8 font-inter drop-shadow-lg">Vehicles List</h1>

  <!-- Vehicles Table -->
  <div class="bg-white rounded-lg shadow overflow-hidden">
    <table class="w-full">
      <thead>
        <tr class="bg-gray-50">
          <th class="p-4 text-left font-medium text-gray-700 whitespace-nowrap border-b border-gray-100">Vehicle ID</th>
          <th class="p-4 text-left font-medium text-gray-700 whitespace-nowrap border-b border-gray-100">Vehicle type</th>
          <th class="p-4 text-left font-medium text-gray-700 whitespace-nowrap border-b border-gray-100">Driver</th>
          <th class="p-4 text-left font-medium text-gray-700 whitespace-nowrap border-b border-gray-100">Driver ID</th>
          <th class="p-4 text-left font-medium text-gray-700 whitespace-nowrap border-b border-gray-100">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let vehicle of paginatedVehicles; let i = index" 
            [class]="'whitespace-nowrap hover:bg-gray-100 transition-colors duration-150'"
            [ngClass]="{'bg-[#D0F6FF]': i % 2 === 1}">
          <td class="p-4 text-gray-700 border-b border-gray-100">{{ vehicle.vehicleId }}</td>
          <td class="p-4 text-gray-700 border-b border-gray-100">{{ vehicle.vehicleType }}</td>
          <td class="p-4 text-gray-700 border-b border-gray-100">{{ vehicle.driver }}</td>
          <td class="p-4 text-gray-700 border-b border-gray-100">{{ vehicle.driverId }}</td>
          <td class="p-4 border-b border-gray-100">
            <span class="px-3 py-1.5 rounded-full text-sm font-medium"
                  [class.bg-green-100]="vehicle.status === 'idle'"
                  [class.text-green-800]="vehicle.status === 'idle'"
                  [class.bg-blue-100]="vehicle.status === 'delivering'"
                  [class.text-blue-800]="vehicle.status === 'delivering'">
              {{ vehicle.status }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="flex items-center justify-between mt-6">
    <button class="px-4 py-2 border rounded-md text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="currentPage === 1" 
            (click)="onPageChange(currentPage - 1)">
      Previous
    </button>
    <div class="flex gap-2">
      <button 
        *ngFor="let page of [1, 2, 3]" 
        class="w-10 h-10 flex items-center justify-center border rounded-md"
        [class.bg-blue-500]="currentPage === page"
        [class.text-white]="currentPage === page"
        [class.text-gray-700]="currentPage !== page"
        [class.hover:bg-gray-50]="currentPage !== page"
        (click)="onPageChange(page)"
      >
        {{ page }}
      </button>
    </div>
    <button class="px-4 py-2 border rounded-md text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="currentPage === 3" 
            (click)="onPageChange(currentPage + 1)">
      Next
    </button>
  </div>
</div>
