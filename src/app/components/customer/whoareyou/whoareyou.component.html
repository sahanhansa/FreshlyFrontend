<!-- Fullscreen container with center alignment and background color -->
<div class="min-h-screen flex flex-col items-center justify-center bg-gray-100">

  <!-- Page title -->
  <h1 class="text-2xl font-bold text-gray-800 mb-24">Who Are You?</h1>

  <!-- Grid container for role selection cards, centered and with smaller cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6 md:gap-8 mx-auto">

    <!-- Customer role card -->
    <div (click)="goTo('customer')" class="w-56 sm:w-64 bg-white p-4 rounded-xl shadow-lg text-center cursor-pointer hover:scale-105 transition">
      <img src="assets/customer-img.jpeg" alt="Customer" class="w-36 h-36 mx-auto mb-3" />
      <h2 class="text-lg font-semibold text-red-600">Customer</h2>
      <p class="text-gray-500">Click here to login/signup</p>
    </div>

    <!-- Laundry role card -->
    <div (click)="goTo('laundry')" class="w-56 sm:w-64 bg-white p-4 rounded-xl shadow-lg text-center cursor-pointer hover:scale-105 transition">
      <img src="assets/laundry.avif" alt="Laundry" class="w-36 h-36 mx-auto mb-3" />
      <h2 class="text-lg font-semibold text-red-600">Laundry</h2>
      <p class="text-gray-500">Click here to login/signup</p>
    </div>

    <!-- Admin role card -->
    <div (click)="goTo('admin')" class="w-56 sm:w-64 bg-white p-4 rounded-xl shadow-lg text-center cursor-pointer hover:scale-105 transition">
      <img src="assets/admin-img.jpeg" alt="Admin" class="w-36 h-36 mx-auto mb-3" />
      <h2 class="text-lg font-semibold text-red-600">Admin</h2>
      <p class="text-gray-500">Click here to login</p>
    </div>

    <!-- Driver role card -->
    <div (click)="goTo('driver')" class="w-56 sm:w-64 bg-white p-4 rounded-xl shadow-lg text-center cursor-pointer hover:scale-105 transition">
      <img src="assets/pick-driver.png" alt="Driver" class="w-36 h-36 mx-auto mb-3" />
      <h2 class="text-lg font-semibold text-red-600">Driver</h2>
      <p class="text-gray-500">Click here to login</p>
    </div>

  </div>
</div>
