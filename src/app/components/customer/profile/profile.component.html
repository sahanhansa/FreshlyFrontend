<div class="max-w-6xl min-h-screen p-6 mx-auto bg-gray-50">
  <!-- Profile Header -->
  <div class="flex items-center p-6 mb-8 text-white shadow-xl bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl">
    <div class="flex items-center justify-center w-20 h-20 mr-6 border-2 bg-white/20 backdrop-blur-sm rounded-xl border-white/30">
      <span class="text-3xl opacity-90">👤</span>
    </div>
    <div>
      <h2 class="mb-2 text-3xl font-bold">Customer Profile</h2>
      <p class="text-lg font-medium opacity-90">Account Information & Order Management</p>
    </div>
  </div>

  <!-- Profile Content -->
  <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">
    <!-- Profile Details -->
    <div class="lg:col-span-2">
      <div class="p-8 transition-all duration-300 bg-white border border-gray-100 shadow-lg rounded-2xl hover:shadow-xl hover:-translate-y-1">
        <h3 class="pb-3 mb-6 text-xl font-semibold text-gray-800 border-b-2 border-gray-200">
          Personal Information
        </h3>
        
        <div class="mb-6 space-y-5">
          <div class="flex flex-col space-y-2">
            <label class="text-sm font-semibold tracking-wide text-gray-500 uppercase">Full Name</label>
            <span class="p-3 text-base font-medium text-gray-700 border-l-4 border-indigo-500 rounded-lg bg-gray-50">
              {{ name || 'Not provided' }}
            </span>
          </div>
          
          <div class="flex flex-col space-y-2">
            <label class="text-sm font-semibold tracking-wide text-gray-500 uppercase">Email Address</label>
            <span class="p-3 text-base font-medium text-gray-700 border-l-4 border-indigo-500 rounded-lg bg-gray-50">
              {{ email || 'Not provided' }}
            </span>
          </div>
          
          <div class="flex flex-col space-y-2">
            <label class="text-sm font-semibold tracking-wide text-gray-500 uppercase">Phone Number</label>
            <span class="p-3 text-base font-medium text-gray-700 border-l-4 border-indigo-500 rounded-lg bg-gray-50">
              {{ phone || 'Not provided' }}
            </span>
          </div>
          
          <div class="flex flex-col space-y-2">
            <label class="text-sm font-semibold tracking-wide text-gray-500 uppercase">Address</label>
            <span class="p-3 text-base font-medium text-gray-700 border-l-4 border-indigo-500 rounded-lg bg-gray-50">
              {{ address || 'Not provided' }}
            </span>
          </div>
        </div>
        
        <button 
          class="flex items-center space-x-2 px-5 py-3 bg-gray-100 hover:bg-gray-200 border-2 border-gray-200 hover:border-gray-300 rounded-lg font-semibold text-gray-600 transition-all duration-200 hover:-translate-y-0.5"
          (click)="onEditProfile()">
          <span class="text-base">✏️</span>
          <span>Edit Profile</span>
        </button>
      </div>
    </div>

    <!-- Profile Actions -->
    <div class="lg:col-span-1">
      <div class="p-8 transition-all duration-300 bg-white border border-gray-100 shadow-lg rounded-2xl hover:shadow-xl hover:-translate-y-1">
        <h3 class="pb-3 mb-6 text-xl font-semibold text-gray-800 border-b-2 border-gray-200">
          Order Management
        </h3>
        
        <div class="space-y-4">
          <button 
            class="flex items-center w-full p-5 space-x-4 font-semibold text-white transition-all duration-300 shadow-lg bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 rounded-xl hover:shadow-xl hover:-translate-y-1"
            (click)="onViewCurrentOrders()">
            <span class="text-2xl">🛍️</span>
            <div class="flex flex-col items-start">
              <span class="text-base font-bold">Current Orders</span>
              <span class="text-sm font-normal opacity-90">View active orders</span>
            </div>
          </button>
          
          <button 
            class="flex items-center w-full p-5 space-x-4 font-semibold text-white transition-all duration-300 shadow-lg bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 rounded-xl hover:shadow-xl hover:-translate-y-1"
            (click)="onViewOrderHistory()">
            <span class="text-2xl">📋</span>
            <div class="flex flex-col items-start">
              <span class="text-base font-bold">Order History</span>
              <span class="text-sm font-normal opacity-90">View past orders</span>
            </div>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
