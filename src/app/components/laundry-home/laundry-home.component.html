<div class="min-h-screen bg-white flex flex-col justify-between">
    
     <app-header></app-header>
      
    <!-- Main Content -->
    <main class="flex flex-col lg:flex-10/12 items-center justify-between px-40 py-20">
      <div class="max-w-md ">
        <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">
          Welcome <span class="text-blue-600">{{ laundryName }}</span>!
        </h1>
        <p class="text-gray-500 mb-6 text-center">Manage Your Orders Efficiently</p>
  
        <div class="flex gap-24  ">
          <div
            class="bg-white border rounded-lg shadow-md p-4 w-40 cursor-pointer hover:shadow-xl transition "
            (click)="goToExpress()"
          >
            <img src="assets/laundry.png" alt="Express" class="h-24 mx-auto" />
            <p class="text-center font-semibold mt-2">Express Deliveries</p>
          </div>
  
          <div
            class="bg-white border rounded-lg shadow-md p-4 w-40 cursor-pointer hover:shadow-xl transition"
            (click)="goToRegular()"
          >
            <img src="assets/laundry-man.jpg" alt="Regular" class="h-24 mx-auto" />
            <p class="text-center font-semibold mt-2">Regular Orders</p>
          </div>
        </div>
      </div>
  
    <!-- Illustration
      <div class="mt-10 lg:mt-0">
        <img src="assets/laundry.avif" alt="Laundry" class="max-w-md w-full" />
      </div> -->
    </main> 
  
    <!-- Footer -->
   <app-footer></app-footer>
  </div>
