<nav class="bg-white shadow p-4">
  <div class="max-w-7xl mx-auto flex justify-between items-center">
    <!-- Logo -->
    <div class="text-blue-500 text-2xl font-bold flex items-center space-x-2">
      <img src="logo.png" alt="Logo" class="h-10 w-auto object-contain" />
    </div>

    <!-- Desktop Nav -->
    <ul class="hidden md:flex space-x-8">
      <li *ngFor="let tab of tabs">
        <a 
          [routerLink]="tab.path" 
          routerLinkActive="font-semibold text-black"
          [routerLinkActiveOptions]="{ exact: true }"
          [ngClass]="'text-gray-700 hover:text-blue-500 px-3 py-2 transition-colors duration-200'"
        >
          {{ tab.label }}
        </a>
      </li>
    </ul>

    <!-- Hamburger -->
    <button class="md:hidden" (click)="isMobileMenuOpen = !isMobileMenuOpen">
      <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </div>

  <!-- Mobile Nav -->
  <div *ngIf="isMobileMenuOpen" class="md:hidden mt-2 space-y-2 px-4">
    <a 
      *ngFor="let tab of tabs" 
      [routerLink]="tab.path"
      routerLinkActive="font-semibold text-black"
      [routerLinkActiveOptions]="{ exact: true }"
      class="block text-gray-700 hover:text-blue-500 py-2 transition-colors duration-200"
    >
      {{ tab.label }}
    </a>
  </div>
</nav>
