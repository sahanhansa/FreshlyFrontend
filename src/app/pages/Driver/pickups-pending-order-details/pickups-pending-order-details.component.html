<!-- Driver Navbar always full width -->
<div class="w-full">
  <app-driver-navbar></app-driver-navbar>
</div>

<!-- Header with responsive padding -->
<div class="px-4 sm:px-6 lg:px-8">
  <app-pickup-details-header></app-pickup-details-header>
</div>

<!-- Loading Spinner -->
<div *ngIf="!pickupOrder" class="flex flex-col items-center justify-center py-10">
  <div class="spinner w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
  <p class="text-gray-600 mt-4 text-center">Loading order details...</p>
</div>

<!-- Main Content -->
<div *ngIf="pickupOrder" class="px-4 sm:px-6 lg:px-8 space-y-6">

  <app-order-details-pending 
    (noteChange)="onInputReceived($event)" 
    [pickupOrder]="pickupOrder">
  </app-order-details-pending>

  <!-- If driverId is null, show taken order -->
  <div *ngIf="driverId == null">
    <app-driver-taken-order 
      [orderId]="orderId" 
      (orderConfirmed)="onOrderConfirmed($event)">
    </app-driver-taken-order>
  </div>

  <!-- If driverId is not null AND status is 'order placed', show pickup question -->
  <div *ngIf="driverId != null && pickupOrder.status === 'order placed'">
    <app-pickup-question 
      (orderedConfirmed)="onOrderConfirmed($event)" 
      [note]="note" 
      [orderId]="orderId">
    </app-pickup-question>
  </div>
</div>

<!-- ✅ FOOTER -->
<div class="w-full mt-12">
  <app-footer></app-footer>
</div>
