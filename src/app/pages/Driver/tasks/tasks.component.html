<div><app-driver-navbar></app-driver-navbar></div>
<br />

<div class="header-container">
    <h1 class="title">Completed Tasks</h1>
    <p class="subtitle">Review the details of this Completed task</p>
</div>

<br />

<div class="relative max-w-md mx-auto ml-5">
    <input type="search" placeholder="Search by Laundry or Customer name..." aria-label="Search"
        [(ngModel)]="searchText" (input)="onSearchInput()" class="w-full py-3 px-4 mr-12 rounded-xl border border-gray-300 shadow-sm
           focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500
           transition duration-200 ease-in-out" />
    <button (click)="onSearchButton()" aria-label="Search Button"
        class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-blue-600 transition duration-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"
            viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
    </button>
</div>


<br />

<div class="overflow-x-auto min-h-screen p-4 bg-gray-50">
  <table class="min-w-full divide-y divide-gray-200 shadow-md rounded-lg bg-white">
    <thead class="bg-gradient-to-r from-blue-600 to-blue-800 text-white">
      <tr>
        <th scope="col" class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider">Order ID</th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider">Customer Name</th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider">Laundry Name</th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider">Status</th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider">Address</th>
        <th scope="col" class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider">Contact</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-200">
      <tr *ngFor="let order of filteredOrders"
          [ngClass]="{
            'bg-green-50 text-green-800 font-semibold': order.status === 'delivered',
            'bg-yellow-50 text-yellow-800 font-semibold': order.status !== 'delivered'
          }"
          class="hover:bg-blue-100 transition duration-200 cursor-pointer">
        <td class="px-6 py-4 whitespace-nowrap text-sm font-mono text-gray-700">{{ order.orderId }}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ order.customerName }}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ order.laundryName }}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm">{{ order.status }}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">{{ order.address }}</td>
        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">{{ order.contact.join(', ') }}</td>
      </tr>
      <tr *ngIf="filteredOrders.length === 0">
        <td colspan="6" class="text-center py-10 italic text-gray-500">No orders found</td>
      </tr>
    </tbody>
  </table>
</div>


<br />
<div><app-footer></app-footer></div>
