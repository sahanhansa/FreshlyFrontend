<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4 py-12">
  <div class="w-full max-w-3xl bg-white rounded-3xl shadow-2xl p-10 space-y-12">

    <!-- Profile Image Section -->
    <div class="flex flex-col items-center text-center space-y-6">
      <div class="relative w-36 h-36">
        <img
          [src]="imagePreview || profilePhoto"
          alt="Profile"
          class="w-36 h-36 rounded-full object-cover border-4 border-white shadow-lg"
        />
        <label
          for="profileImage"
          class="absolute bottom-0 right-0 bg-blue-600 text-white p-3 rounded-full cursor-pointer hover:bg-blue-700 transition-all duration-200 shadow-md"
          title="Change Profile Picture"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15.232 5.232l3.536 3.536M9 13h3l8-8a2.828 2.828 0 10-4-4l-8 8v3z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7l-1.5-1.5" />
          </svg>
        </label>
        <input id="profileImage" type="file" hidden (change)="onImageSelected($event)" accept="image/*" />
      </div>
      <button 
        (click)="updateImage()" 
        class="bg-blue-600 text-white py-2 px-8 rounded-full font-medium hover:bg-blue-700 transition duration-200 shadow-md"
      >
        Save Image
      </button>
      <h2 class="text-3xl font-extrabold text-gray-800">Edit Profile</h2>
      <p class="text-gray-500 max-w-lg">Keep your profile up to date for a better experience and secure account management.</p>
    </div>

    <!-- Account Details Form -->
    <form [formGroup]="accountForm" (ngSubmit)="onAccountSubmit()" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <input type="text" placeholder="First Name" formControlName="firstName"
          class="w-full p-4 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm" />

        <input type="text" placeholder="Last Name" formControlName="lastName"
          class="w-full p-4 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm" />
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <input type="text" placeholder="Contact Number" formControlName="contactNumber"
          class="w-full p-4 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm" />

        <input type="email" placeholder="Email" formControlName="email"
          class="w-full p-4 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm" />
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <input type="text" placeholder="House No." formControlName="houseNo"
          class="w-full p-4 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm" />

        <input type="text" placeholder="Street" formControlName="street"
          class="w-full p-4 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm" />
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <input type="text" placeholder="City" formControlName="city"
          class="w-full p-4 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm" />

        <input type="text" placeholder="Postal Code" formControlName="postalCode"
          class="w-full p-4 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none shadow-sm" />
      </div>

      <button
        type="submit"
        class="w-full py-4 rounded-xl bg-blue-600 text-white font-semibold text-lg hover:bg-blue-700 transition duration-200 shadow-md"
      >
        Save Details
      </button>
    </form>

    <!-- Change Password Section -->
    <div class="pt-10 border-t border-gray-200">
  <h3 class="text-2xl font-bold text-gray-800 mb-6">Change Password</h3>
  <form [formGroup]="passwordForm" (ngSubmit)="onPasswordSubmit()" class="space-y-6">

    <!-- Current Password -->
    <div class="relative">
      <input
        [type]="showCurrentPassword ? 'text' : 'password'"
        placeholder="Current Password"
        formControlName="currentPassword"
        class="w-full p-4 rounded-xl border border-gray-300 focus:ring-2 focus:ring-yellow-500 outline-none shadow-sm"
      />
      <button
        type="button"
        (click)="showCurrentPassword = !showCurrentPassword"
        class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700"
      >
        <svg *ngIf="!showCurrentPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
          fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
        <svg *ngIf="showCurrentPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
          fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.973 9.973 0 012.181-3.568M6.253 6.253A9.967 9.967 0 0112 5c4.478 0 8.268 2.943 9.542 7a9.978 9.978 0 01-4.21 5.568M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 3l18 18" />
        </svg>
      </button>
    </div>

    <!-- New + Confirm Password -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- New Password -->
      <div class="relative">
        <input
          [type]="showNewPassword ? 'text' : 'password'"
          placeholder="New Password"
          formControlName="password"
          class="w-full p-4 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-500 outline-none shadow-sm"
        />
        <button
          type="button"
          (click)="showNewPassword = !showNewPassword"
          class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700"
        >
          <svg *ngIf="!showNewPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
            fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          <svg *ngIf="showNewPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
            fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.973 9.973 0 012.181-3.568M6.253 6.253A9.967 9.967 0 0112 5c4.478 0 8.268 2.943 9.542 7a9.978 9.978 0 01-4.21 5.568M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 3l18 18" />
          </svg>
        </button>
      </div>

      <!-- Confirm Password -->
      <div class="relative">
        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          placeholder="Confirm New Password"
          formControlName="confirmPassword"
          class="w-full p-4 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-500 outline-none shadow-sm"
        />
        <button
          type="button"
          (click)="showConfirmPassword = !showConfirmPassword"
          class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700"
        >
          <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
            fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
            fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.973 9.973 0 012.181-3.568M6.253 6.253A9.967 9.967 0 0112 5c4.478 0 8.268 2.943 9.542 7a9.978 9.978 0 01-4.21 5.568M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 3l18 18" />
          </svg>
        </button>
      </div>

    </div>

    <button
      type="submit"
      class="w-full py-4 rounded-xl bg-green-600 text-white font-semibold text-lg hover:bg-green-700 transition duration-200 shadow-md"
    >
      Update Password
    </button>

  </form>
</div>


  </div>
</div>
