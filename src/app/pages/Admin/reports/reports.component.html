<div class="flex h-screen">
  <div class="w-64 bg-gray-800 text-white p-4 pt-16">
    <div class="flex items-center gap-3 p-3 bg-blue-600 rounded-lg mb-2">
      <i class="fas fa-chart-line"></i>
      <span>Vave Report</span>
    </div>
    <button type="button" (click)="scrollToLeaderboard()" class="flex items-center gap-3 p-3 hover:bg-gray-700 rounded-lg mb-2 cursor-pointer w-full text-left bg-transparent border-0 focus:outline-none">
      <i class="fas fa-store"></i>
      <span>Laundry Leaderboard</span>
    </button>
  </div>

  <div class="flex-1 p-6 overflow-auto pt-16">

    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2">
          <label class="text-gray-700">From:</label>
          <select [(ngModel)]="fromYear" class="px-2 py-2 border rounded-md mr-2">
            <option *ngFor="let y of years" [value]="y">{{ y }}</option>
          </select>
          <select [(ngModel)]="fromMonth" class="px-2 py-2 border rounded-md">
            <option *ngFor="let m of months" [value]="m.value">{{ m.name }}</option>
          </select>
        </div>
        <div class="flex items-center gap-2">
          <label class="text-gray-700">To:</label>
          <select [(ngModel)]="toYear" class="px-2 py-2 border rounded-md mr-2">
            <option *ngFor="let y of years" [value]="y">{{ y }}</option>
          </select>
          <select [(ngModel)]="toMonth" class="px-2 py-2 border rounded-md">
            <option *ngFor="let m of months" [value]="m.value">{{ m.name }}</option>
          </select>
        </div>
        <div class="flex items-center gap-2 ml-8">
          <label class="text-gray-700">Laundry:</label>
          <select [(ngModel)]="selectedLaundryId" class="px-2 py-2 border rounded-md min-w-[180px]">
            <option [ngValue]="null">All</option>
            <option *ngFor="let laundry of laundries" [ngValue]="laundry.laundryId">{{ laundry.laundryName }}</option>
          </select>
        </div>
      </div>
      <button class="flex items-center gap-2 px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors" (click)="downloadReport()">
        <i class="fas fa-download"></i>
        Download
      </button>
    </div>



    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <app-revenue-per-month></app-revenue-per-month>
    </div>

    <div class="mb-6" id="laundry-leaderboard-section">
      <app-laundry-leaderboard #laundryLeaderboardComp
        (loadingChange)="laundryLoading = $event"
        (errorChange)="laundryError = $event"
      ></app-laundry-leaderboard>
    </div>

    <!-- Add a global error message if leaderboard fails -->
    <div *ngIf="laundryError" class="text-red-500 text-center py-2 font-semibold">
      Laundry leaderboard failed to load. Please try again.
    </div>

    <div class="grid grid-cols-3 gap-6 mb-6">
      <div class="bg-white rounded-lg shadow p-6">
        <h4 class="text-gray-600 mb-2">Active Users</h4>
        <div class="text-2xl font-bold">
          <!-- Active users display removed: property no longer exists -->
        </div>
      </div>
      <div class="bg-white rounded-lg shadow p-6">
        <h4 class="text-gray-600 mb-2">Total Revenue</h4>
        <div class="text-2xl font-bold">
          <!-- Total revenue display removed: property no longer exists -->
        </div>
      </div>
      <div class="bg-white rounded-lg shadow p-6">
        <h4 class="text-gray-600 mb-2">New Users</h4>
        <div class="text-2xl font-bold">
          <!-- New users display removed: property no longer exists -->
        </div>
      </div>
    </div>

    <!-- Disable download if leaderboard is loading or errored -->
    <button class="flex items-center gap-2 px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors" (click)="downloadReport()" [disabled]="laundryLoading || laundryError">
      <i class="fas fa-download"></i>
      Download
    </button>
  </div>
</div>
