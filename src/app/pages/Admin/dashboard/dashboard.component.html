<div class="py-6 pt-16">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <h1 class="text-2xl font-semibold text-gray-900">Dashboard</h1>
    <div class="mt-6">
      <div class="bg-white shadow-sm rounded-lg p-6 mb-6">
        <h2 class="text-lg font-medium text-gray-900 mb-4">Revenue Overview</h2>
        <app-laundry-revenue-chart
          [months]="months"
          [laundryRevenueData]="laundryRevenueData"
          [laundryNames]="laundryNames"
          [selectedLaundryId]="selectedLaundryId"
        ></app-laundry-revenue-chart>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-blue-50 rounded-lg shadow p-6 flex flex-col items-center justify-center">
          <div class="text-4xl font-extrabold text-blue-800">{{ activeCustomers }}/{{ totalCustomers }}</div>
          <div class="text-sm text-gray-500 mt-2">Active customers / Total customers</div>
        </div>
      </div>
    </div>
  </div>
</div>
