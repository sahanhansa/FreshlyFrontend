<div class="min-h-screen flex flex-col bg-gray-50">
  <div class="flex-grow bg-gray-50">
    <div class="max-w-6xl mx-auto p-4">
      <!-- Page Heading -->
       <div class="text-center mb-8 mt-4">
        <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Basket</h1>
        <p class="mt-2 text-lg text-gray-500">Your basket keeps all your laundry activities organized in one place for a seamless experience.</p>
      </div>
      <!-- <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Basket</h1>
        <p class="mt-2 text-lg text-gray-500">
          Review and manage your laundry orders. Easily track your pending, ongoing, and completed orders, and make payments when ready.
        </p>
        <p class="mt-1 text-base text-gray-400">
          Your basket keeps all your laundry activities organized in one place for a seamless experience.
        </p>
      </div> -->
      <!-- Sleek Modern Tabs for Categories -->
      <div class="flex bg-gray-100 rounded-xl p-2 mb-8 overflow-x-auto hide-scrollbar space-x-2">
        <!-- Pending tab button -->
        <button
          (click)="setActiveTab('pending')"
          class="flex-1 px-6 py-3 font-medium rounded-lg transition-all duration-300 text-center relative shadow-sm "
          [ngClass]="{
            'bg-white text-blue-600 shadow-md': activeTab === 'pending',
            'text-gray-500 hover:bg-gray-200 hover:text-gray-700': activeTab !== 'pending'
          }"
        >
          <span class="flex items-center gap-1.5 justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Pending
          </span>
        </button>
        
        <!-- Ongoing tab button -->
        <button
          (click)="setActiveTab('ongoing')"
          class="flex-1 px-6 py-3 font-medium rounded-lg transition-all duration-300 text-center relative shadow-sm "
          [ngClass]="{
            'bg-white text-blue-600 shadow-md': activeTab === 'ongoing',
            'text-gray-500 hover:bg-gray-200 hover:text-gray-700': activeTab !== 'ongoing'
          }"
        >
          <span class="flex items-center gap-1.5 justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Ongoing
          </span>
        </button>
        
        <!-- To Pay tab button -->
        <button
          (click)="setActiveTab('toPay')"
          class="flex-1 px-6 py-3 font-medium rounded-lg transition-all duration-300 text-center relative shadow-sm "
          [ngClass]="{
            'bg-white text-blue-600 shadow-md': activeTab === 'toPay',
            'text-gray-500 hover:bg-gray-200 hover:text-gray-700': activeTab !== 'toPay'
          }"
        >
          <span class="flex items-center gap-1.5 justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            To Pay
          </span>
        </button>
        
        <!-- Completed tab button -->
        <button
          (click)="setActiveTab('completed')"
          class="flex-1 px-6 py-3 font-medium rounded-lg transition-all duration-300 text-center relative shadow-sm "
          [ngClass]="{
            'bg-white text-blue-600 shadow-md': activeTab === 'completed',
            'text-gray-500 hover:bg-gray-200 hover:text-gray-700': activeTab !== 'completed'
          }"
        >
          <span class="flex items-center gap-1.5 justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            Completed
          </span>
        </button>
      </div>

      <!-- Render the Active Tab Content -->
      <div [ngClass]="{'block': activeTab === 'pending', 'hidden': activeTab !== 'pending'}">
        <app-pending-order-list></app-pending-order-list>
      </div>
      <div [ngClass]="{'block': activeTab === 'ongoing', 'hidden': activeTab !== 'ongoing'}">
        <app-ongoing-order-list></app-ongoing-order-list>
      </div>
      <div [ngClass]="{'block': activeTab === 'toPay', 'hidden': activeTab !== 'toPay'}">
        <app-to-pay-order-list></app-to-pay-order-list>
      </div>
      <div [ngClass]="{'block': activeTab === 'completed', 'hidden': activeTab !== 'completed'}">
        <app-completed-order-list></app-completed-order-list>
      </div>
    </div>
  </div>
</div>
