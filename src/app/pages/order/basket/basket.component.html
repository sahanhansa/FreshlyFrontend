<div class="min-h-screen flex flex-col">
  <!-- Main Content -->
  <div class="flex-grow bg-white">
    <div class="max-w-6xl mx-auto p-4">
      <!-- Tabs for Categories -->
      <div class="flex border-b border-gray-200 mt-5 mb-6 overflow-x-auto hide-scrollbar">
        <!-- Pending tab button -->
        <button
          (click)="setActiveTab('pending')"
          class="px-6 py-3 font-medium transition-all duration-300 text-center mr-4 relative"
          [ngClass]="{
            'text-blue-600 font-semibold': activeTab === 'pending',
            'text-gray-500 hover:text-gray-700': activeTab !== 'pending'
          }"
        >
          <span class="flex items-center gap-1.5">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Pending
          </span>
          <div *ngIf="activeTab === 'pending'" class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600 transition-all duration-300"></div>
        </button>
        
        <!-- Ongoing tab button -->
        <button
          (click)="setActiveTab('ongoing')"
          class="px-6 py-3 font-medium transition-all duration-300 text-center mr-4 relative"
          [ngClass]="{
            'text-blue-600 font-semibold': activeTab === 'ongoing',
            'text-gray-500 hover:text-gray-700': activeTab !== 'ongoing'
          }"
        >
          <span class="flex items-center gap-1.5">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Ongoing
          </span>
          <div *ngIf="activeTab === 'ongoing'" class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600 transition-all duration-300"></div>
        </button>
        
        <!-- To Pay tab button -->
        <button
          (click)="setActiveTab('toPay')"
          class="px-6 py-3 font-medium transition-all duration-300 text-center mr-4 relative"
          [ngClass]="{
            'text-blue-600 font-semibold': activeTab === 'toPay',
            'text-gray-500 hover:text-gray-700': activeTab !== 'toPay'
          }"
        >
          <span class="flex items-center gap-1.5">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            To Pay
          </span>
          <div *ngIf="activeTab === 'toPay'" class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600 transition-all duration-300"></div>
        </button>
        
        <!-- Completed tab button -->
        <button
          (click)="setActiveTab('completed')"
          class="px-6 py-3 font-medium transition-all duration-300 text-center relative"
          [ngClass]="{
            'text-blue-600 font-semibold': activeTab === 'completed',
            'text-gray-500 hover:text-gray-700': activeTab !== 'completed'
          }"
        >
          <span class="flex items-center gap-1.5">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            Completed
          </span>
          <div *ngIf="activeTab === 'completed'" class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600 transition-all duration-300"></div>
        </button>
      </div>

      <!-- Render the Active Tab Content -->
      <div [ngClass]="{'block': activeTab === 'pending', 'hidden': activeTab !== 'pending'}">
        <app-pending-order-list></app-pending-order-list>
      </div>
      <div [ngClass]="{'block': activeTab === 'ongoing', 'hidden': activeTab !== 'ongoing'}">
        <app-ongoing-order-list></app-ongoing-order-list>
      </div>
      <div [ngClass]="{'block': activeTab === 'toPay', 'hidden': activeTab !== 'toPay'}">
        <app-to-pay-order-list></app-to-pay-order-list>
      </div>
      <div [ngClass]="{'block': activeTab === 'completed', 'hidden': activeTab !== 'completed'}">
        <app-completed-order-list></app-completed-order-list>
      </div>
    </div>
  </div>
</div>
