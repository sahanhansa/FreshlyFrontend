<div class="min-h-screen flex flex-col">
  <!-- Main Content -->
  <div class="flex-grow bg-white">
    <div class="max-w-6xl mx-auto p-4">
      <!-- Tabs for Categories -->
      <div class="flex border-b border-gray-200 mb-6">
        <button
          (click)="setActiveTab('pending')"
          class="px-6 py-3 font-medium transition-all duration-300 text-center mr-6 relative"
          [ngClass]="{
            'text-blue-600 font-semibold': activeTab === 'pending',
            'text-gray-500 hover:text-gray-700': activeTab !== 'pending'
          }"
        >
          Pending Orders
          <div *ngIf="activeTab === 'pending'" class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600 transition-all duration-300"></div>
        </button>
        
        <button
          (click)="setActiveTab('ongoing')"
          class="px-6 py-3 font-medium transition-all duration-300 text-center mr-6 relative"
          [ngClass]="{
            'text-blue-600 font-semibold': activeTab === 'ongoing',
            'text-gray-500 hover:text-gray-700': activeTab !== 'ongoing'
          }"
        >
          Ongoing Orders
          <div *ngIf="activeTab === 'ongoing'" class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600 transition-all duration-300"></div>
        </button>
        
        <button
          (click)="setActiveTab('past')"
          class="px-6 py-3 font-medium transition-all duration-300 text-center relative"
          [ngClass]="{
            'text-blue-600 font-semibold': activeTab === 'past',
            'text-gray-500 hover:text-gray-700': activeTab !== 'past'
          }"
        >
          Past Orders
          <div *ngIf="activeTab === 'past'" class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600 transition-all duration-300"></div>
        </button>
      </div>

      <!-- Render the Active Tab Content -->
      <div class="transition-opacity duration-300 ease-in-out">
        <div *ngIf="activeTab === 'pending'" class="animate-fadeIn">
          <app-pending-order-list></app-pending-order-list>
        </div>
        <div *ngIf="activeTab === 'ongoing'" class="animate-fadeIn">
          <app-ongoing-order-list></app-ongoing-order-list>
        </div>
        <div *ngIf="activeTab === 'past'" class="animate-fadeIn">
          <app-past-order-list></app-past-order-list>
        </div>
      </div>
    </div>
  </div>
</div>
