<div class="flex flex-col gap-6 ">
  <!-- Heading -->
  <div class="pl-35 pt-15">
    <h2 class="text-2xl font-semibold text-gray-800">Clothing Types</h2>
    <p class="text-gray-600 mt-2">Add the items you need to be cleaned to your basket.</p>
  </div>

  <!-- Item Category Component -->
  <app-item-category
    (categorySelected)="onCategorySelected($event)"
    class="mb-4"
  ></app-item-category>

  <!-- Item Card List -->
  <div class="w-full">
    <app-item-card-list [items]="filteredItems"></app-item-card-list>
  </div>

  <!-- Footer -->
  <footer class="mt-auto">
    <app-footer></app-footer>
  </footer>
</div>
