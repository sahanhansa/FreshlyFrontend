<div class="flex flex-col gap-6">
  <!-- Tab Navigation -->
  <div class="flex flex-wrap gap-2 sm:gap-4 border-b border-gray-300 px-4 sm:px-8 md:px-12 lg:px-36 pt-6 justify-center md:justify-start">
    <button
      *ngFor="let category of categories"
      (click)="onCategorySelected(category.name)"
      [class.text-blue-500]="selectedCategory === category.name"
      [class.border-blue-500]="selectedCategory === category.name"
      class="px-4 py-2 text-md sm:text-md text-gray-600 border-b-2 hover:text-blue-500 hover:border-blue-500 transition"
    >
      {{ category.name }}
    </button>
  </div>

  <!-- Heading -->
  <div class="px-4 sm:px-8 md:px-12 lg:px-36 text-center md:text-left">
    <h2 class="text-md sm:text-md md:text-md lg:text-xl font-semibold text-gray-800">
      {{ selectedCategory }} Items
    </h2>
    <p class="text-md sm:text-base md:text-md text-gray-600 mt-1">
      Add the items you need to be cleaned to your basket.
    </p>
  </div>

  <!-- Item Card List -->
  <div class="w-full">
    <app-item-card-list [items]="filteredItems"></app-item-card-list>
  </div>

  <!-- Footer -->
  <footer class="mt-auto">
    <app-footer></app-footer>
  </footer>
</div>
