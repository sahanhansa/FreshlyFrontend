<div class="min-h-screen flex flex-col">
  <!-- Main Content -->
  <div class="flex-grow bg-white">
    <div class="max-w-6xl mx-auto p-4">
      <!-- Header Section -->
      <div class="text-center md:text-left mb-6">
        <h2 class="text-xl font-semibold text-gray-800">Laundry Items</h2>
        <p class="text-gray-600 text-sm">Select items to add to your basket</p>
      </div>
      
      <!-- Search Bar -->
      <div class="mb-6">
        <app-search-bar
          placeholder="Search for items..."
          ariaLabel="Search for laundry items"
          [initialValue]="searchQuery"
          (searchChanged)="onSearchChanged($event)"
        ></app-search-bar>
      </div>
      
      <!-- Tabs for Categories -->
      <div class="flex border-b border-gray-200 mb-6 overflow-x-auto">
        <button
          (click)="setActiveTab('ladies')"
          class="px-6 py-3 font-medium transition-all duration-300 text-center mr-6 relative"
          [ngClass]="{
            'text-blue-600 font-semibold': activeTab === 'ladies',
            'text-gray-500 hover:text-gray-700': activeTab !== 'ladies'
          }"
        >
          Ladies
          <div *ngIf="activeTab === 'ladies'" class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600 transition-all duration-300"></div>
        </button>
        
        <button
          (click)="setActiveTab('gents')"
          class="px-6 py-3 font-medium transition-all duration-300 text-center mr-6 relative"
          [ngClass]="{
            'text-blue-600 font-semibold': activeTab === 'gents',
            'text-gray-500 hover:text-gray-700': activeTab !== 'gents'
          }"
        >
          Gents
          <div *ngIf="activeTab === 'gents'" class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600 transition-all duration-300"></div>
        </button>
        
        <button
          (click)="setActiveTab('kids')"
          class="px-6 py-3 font-medium transition-all duration-300 text-center mr-6 relative"
          [ngClass]="{
            'text-blue-600 font-semibold': activeTab === 'kids',
            'text-gray-500 hover:text-gray-700': activeTab !== 'kids'
          }"
        >
          Kids
          <div *ngIf="activeTab === 'kids'" class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600 transition-all duration-300"></div>
        </button>
        
        <button
          (click)="setActiveTab('other')"
          class="px-6 py-3 font-medium transition-all duration-300 text-center relative"
          [ngClass]="{
            'text-blue-600 font-semibold': activeTab === 'other',
            'text-gray-500 hover:text-gray-700': activeTab !== 'other'
          }"
        >
          Other
          <div *ngIf="activeTab === 'other'" class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-600 transition-all duration-300"></div>
        </button>
      </div>

      <!-- Loading indicator -->
      <div *ngIf="loading" class="flex justify-center items-center py-12">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
      </div>
      
      <!-- Error state -->
      <div *ngIf="error" class="text-center text-red-500 py-10">
        {{ error }}
        <br />
        <button (click)="retryLoading()" class="mt-3 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
          Try Again
        </button>
      </div>
      
      <!-- No items message -->
      <div *ngIf="!loading && displayedItems.length === 0 && !error" class="text-center py-12">
        <p class="text-gray-500 text-lg">No items found in this category.</p>
      </div>
      
      <!-- Item List -->
      <div *ngIf="!loading && displayedItems.length > 0 && !error" class="transition-opacity duration-300 ease-in-out">
        <app-item-list [items]="displayedItems"></app-item-list>
      </div>
    </div>
  </div>
</div>
