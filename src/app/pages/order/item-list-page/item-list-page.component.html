<div class="min-h-screen flex flex-col bg-gray-50">
  <!-- Main Content -->
  <div class="flex-grow">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      
      <!-- Header Section -->
      <div class="mb-8">
        <h1 class="text-2xl font-bold mt-3 text-gray-800 tracking-tight">Create Your Laundry Order</h1>
        <p class="mt-2 text-lg text-gray-500">Select items from our categories and add them to your basket.</p>
      </div>
      
      <!-- Controls: Tabs and Search Bar -->
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6 mb-8">
        <!-- Tabs for Categories -->
        <div class="flex-grow bg-gray-100 p-1.5 rounded-xl flex items-center space-x-2 overflow-x-auto">
          <!-- Ladies category tab button -->
          <button
            (click)="setActiveTab('ladies')"
            class="w-full px-5 py-2 text-sm font-semibold rounded-lg transition-colors duration-300 focus:outline-none whitespace-nowrap"
            [ngClass]="{
              'bg-white text-blue-600 shadow-md': activeTab === 'ladies',
              'text-gray-500 hover:bg-gray-200 hover:text-gray-700': activeTab !== 'ladies'
            }"
          >
            Ladies
          </button>
          
          <!-- Gents category tab button -->
          <button
            (click)="setActiveTab('gents')"
            class="w-full px-5 py-2 text-sm font-semibold rounded-lg transition-colors duration-300 focus:outline-none whitespace-nowrap"
            [ngClass]="{
              'bg-white text-blue-600 shadow-md': activeTab === 'gents',
              'text-gray-500 hover:bg-gray-200 hover:text-gray-700': activeTab !== 'gents'
            }"
          >
            Gents
          </button>
          
          <!-- Kids category tab button -->
          <button
            (click)="setActiveTab('kids')"
            class="w-full px-5 py-2 text-sm font-semibold rounded-lg transition-colors duration-300 focus:outline-none whitespace-nowrap"
            [ngClass]="{
              'bg-white text-blue-600 shadow-md': activeTab === 'kids',
              'text-gray-500 hover:bg-gray-200 hover:text-gray-700': activeTab !== 'kids'
            }"
          >
            Kids
          </button>
          
          <!-- Other category tab button -->
          <button
            (click)="setActiveTab('other')"
            class="w-full px-5 py-2 text-sm font-semibold rounded-lg transition-colors duration-300 focus:outline-none whitespace-nowrap"
            [ngClass]="{
              'bg-white text-blue-600 shadow-md': activeTab === 'other',
              'text-gray-500 hover:bg-gray-200 hover:text-gray-700': activeTab !== 'other'
            }"
          >
            Other
          </button>
        </div>

        <!-- Search Bar -->
        <div class="w-full md:w-1/3">
          <app-search-bar
            placeholder="Search in this category..."
            ariaLabel="Search for laundry items"
            [initialValue]="searchQuery"
            (searchChanged)="onSearchChanged($event)"
          ></app-search-bar>
        </div>
      </div>

      <!-- Main Content Area: Loading, Error, Empty, and Item List -->
      <div class="mt-4">
        <!-- Loading spinner -->
        <div *ngIf="loading" class="flex flex-col items-center justify-center py-20 text-center">
          <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
          <p class="mt-4 text-gray-600 font-medium">Loading items, please wait...</p>
        </div>
        
        <!-- Error message -->
        <div *ngIf="error" class="text-center py-12 bg-red-50 border border-red-200 rounded-lg">
          <h3 class="text-xl font-semibold text-red-700">Oops! Something went wrong.</h3>
          <p class="mt-2 text-red-600">{{ error }}</p>
          <button (click)="retryLoading()" class="mt-6 px-6 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors shadow-sm">
            Try Again
          </button>
        </div>
        
        <!-- Empty state message -->
        <div *ngIf="!loading && displayedItems.length === 0 && !error" class="text-center py-20 bg-white border border-gray-200 rounded-lg">
          <h3 class="text-xl font-semibold text-gray-700">No Items Found</h3>
          <p class="mt-2 text-gray-500">We couldn't find any items matching your search in this category.</p>
        </div>
        
        <!-- Item list container -->
        <div *ngIf="!loading && displayedItems.length > 0 && !error" class="transition-opacity duration-500 ease-in-out">
          <app-item-list [items]="displayedItems"></app-item-list>
        </div>
      </div>
    </div>
  </div>
</div>
