<div class="max-w-4xl mx-auto p-4 bg-white shadow-md rounded-lg">

  <h1 class="text-2xl font-bold mb-6">Order Summary</h1>

  <div *ngFor="let service of services" class="mb-8">
    <h2 class="text-xl font-semibold text-blue-800 mb-3 border-b border-gray-500 pb-1">{{ service }}</h2>

    <div *ngIf="getItemsByService(service).length > 0; else noItems">
      <div class="grid grid-cols-4 gap-4 font-semibold mb-2 text-gray-700">
        <div>Item</div>
        <div class="text-center">Quantity</div>
        <div class="text-right">Price (Rs.)</div>
        <div class="text-center">Status</div>
      </div>

      <div *ngFor="let item of getItemsByService(service)" class="grid grid-cols-4 gap-4 items-center py-2 hover:bg-gray-50 rounded">
        <div class="flex items-center space-x-3">
          <img [src]="item.imageUrl" alt="{{item.name}}" class="w-12 h-12 object-cover rounded" />
          <span>{{ item.name }}</span>
        </div>
        <div class="text-center">{{ item.quantity }}</div>
        <div class="text-right">{{ item.quantity * item.pricePerUnit }}</div>
        <div class="text-center">
          <select
            [value]="item.status"
            (change)="updateStatus(item, $event)"
            [ngClass]="getStatusColor(item.status) + ' border border-gray-300 rounded px-2 py-1'"
          >
            <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
          </select>
        </div>
      </div>
    </div>

    <ng-template #noItems>
      <p class="text-gray-500 italic">No items in this service.</p>
    </ng-template>

    <div *ngIf="getRejectedItemsByService(service).length > 0" class="mt-4 p-3 bg-red-50 border border-red-200 rounded">
      <h3 class="text-red-600 font-semibold mb-2">Rejected Items</h3>
      <ul class="list-disc list-inside space-y-1 text-red-700">
        <li *ngFor="let item of getRejectedItemsByService(service)">
          {{ item.name }} - Qty: {{ item.quantity }}
        </li>
      </ul>
    </div>
  </div>

  <div class="text-right border-t border-gray-300 pt-4">
    <p class="text-lg font-bold">Total Bill: Rs.{{ getTotalPrice() }}</p>
  </div>

</div>
