<div class="min-h-screen flex flex-col">
  <!-- Header -->
  <app-navbar></app-navbar>

  <!-- Main Content -->
  <div class="pt-12 flex-grow pb-16 px-4 sm:px-10 relative bg-gray-50">

    <!-- Welcome Text -->
    <div class="mb-12 relative z-10 max-w-[60%]">
      <h1 class="font-inter font-bold text-gray-800 leading-tight mb-4">
        <span class="block text-[36px] sm:text-[48px] lg:text-[60px]">Welcome</span>
        <span class="block text-[36px] sm:text-[48px] lg:text-[60px] text-[#0A84FF]">{{ laundryName }}!</span>
      </h1>
      <p class="text-gray-600 text-[18px] sm:text-[20px] lg:text-[22px] mb-6">
        Manage your Orders efficiently
      </p>
    </div>

    <!-- Home Image -->
    <img src="assets/Home/home.png" alt="Home"
      class="hidden md:block absolute top-4 right-[-40px] md:right-[-60px] lg:right-[-80px] w-[340px] md:w-[440px] lg:w-[540px] h-auto object-contain z-0 drop-shadow-xl" />

    <!-- Button Grid Container (Half screen) -->
    <div class="w-full md:w-3/5">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-5 z-10 relative">

        <!-- New Orders -->
        <div 
          (click)="goToNewOrder()"
          class="flex items-center gap-4 transition-transform bg-white shadow-sm rounded-xl cursor-pointer transform hover:scale-105 hover:shadow-lg duration-200" 
          style="width: 100%; height: 160px;"
        >
          <div class="flex items-center w-full h-full gap-4 p-6">
            <img src="assets/customer/order.png" alt="New Orders" class="w-16 h-16" />
            <div>
              <h2 class="mb-1 text-xl sm:text-2xl font-semibold text-gray-800">New Orders</h2>
              <p class="text-gray-600 text-sm sm:text-base">View all new orders</p>
            </div>
          </div>
        </div>

        <!-- Processing Orders -->
        <div 
          (click)="goToProcessingOrder()"
          class="flex items-center gap-4 transition-transform bg-white shadow-sm rounded-xl cursor-pointer transform hover:scale-105 hover:shadow-lg duration-200" 
          style="width: 100%; height: 160px;"
        >
          <div class="flex items-center w-full h-full gap-4 p-6">
            <img src="assets/customer/processing.png" alt="Processing Orders" class="w-16 h-16 animate-bounce" style="animation-delay: 100ms;" />
            <div>
              <h2 class="mb-1 text-xl sm:text-2xl font-semibold text-gray-800">Processing Orders</h2>
              <p class="text-gray-600 text-sm sm:text-base">Orders in progress</p>
            </div>
          </div>
        </div>

        <!-- Completed Orders -->
        <div 
          (click)="goToCompletedOrder()"
          class="flex items-center gap-4 transition-transform bg-white shadow-sm rounded-xl cursor-pointer transform hover:scale-105 hover:shadow-lg duration-200" 
          style="width: 100%; height: 160px;"
        >
          <div class="flex items-center w-full h-full gap-4 p-6">
            <img src="assets/customer/cleaned.png" alt="Completed Orders" class="w-16 h-16" />
            <div>
              <h2 class="mb-1 text-xl sm:text-2xl font-semibold text-gray-800">Completed Orders</h2>
              <p class="text-gray-600 text-sm sm:text-base">Successfully delivered</p>
            </div>
          </div>
        </div>

        <!-- Rejected Items -->
        <div 
          (click)="goToRejectedItems()"
          class="flex items-center gap-4 transition-transform bg-white shadow-sm rounded-xl cursor-pointer transform hover:scale-105 hover:shadow-lg duration-200" 
          style="width: 100%; height: 160px;"
        >
          <div class="flex items-center w-full h-full gap-4 p-6">
            <svg class="w-16 h-16" fill="none" viewBox="0 0 48 48" stroke="red" stroke-width="3">
              <circle cx="24" cy="24" r="22" stroke="red" stroke-width="3" fill="#fff"/>
              <line x1="16" y1="16" x2="32" y2="32" stroke="red" stroke-width="4" stroke-linecap="round"/>
              <line x1="32" y1="16" x2="16" y2="32" stroke="red" stroke-width="4" stroke-linecap="round"/>
            </svg>
            <div>
              <h2 class="mb-1 text-xl sm:text-2xl font-semibold text-gray-800">Rejected Items</h2>
              <p class="text-gray-600 text-sm sm:text-base">Items not accepted</p>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- Footer -->
  <app-footer></app-footer>
</div>
