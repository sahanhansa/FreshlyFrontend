<div class="min-h-screen flex flex-col">
  <div class="flex-grow">
   <app-navbar></app-navbar>
<div class="p-6 max-w-3xl mx-auto">
 
 <!-- Centered Title and Subtitle -->
    <div class="text-center mt-2 sm:mt-4 mb-4 sm:mb-6 max-w-full sm:max-w-3xl md:max-w-4xl lg:max-w-5xl mx-auto px-2">
      <h1 class="font-bold drop-shadow-md text-1xl sm:text-2xl md:text-3xl lg:text-4xl">
       Laundry Insights
      </h1>
      <p class="text-gray-700 text-base sm:text-md md:text-lg lg:text-xl mt-1 sm:mt-2">
        Here is your Summary
      </p>
    </div>

  <!-- Download and Year Picker Row -->
  <div class="flex justify-between items-center mb-6">
    <label class="font-semibold">Year:
      <select [(ngModel)]="selectedYear" (change)="onYearChange(selectedYear)" class="ml-2 border rounded px-2 py-1">
        <option *ngFor="let y of years" [value]="y">{{ y }}</option>
      </select>
    </label>
    <div class="flex items-center gap-2">
      <button (click)="downloadInsightsReport()" [disabled]="isDownloading" class="px-4 py-2 rounded bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-60">
        {{ isDownloading ? 'Downloading...' : 'Download Insights Report (PDF)' }}
      </button>
      <span *ngIf="downloadError" class="text-red-600 text-sm">{{ downloadError }}</span>
    </div>
  </div>

  <!-- Chart Type Toggle -->
  <div class="flex justify-center mb-6">
    <button 
      (click)="setChartType('monthly')" 
      [class]="chartType === 'monthly' ? 'px-6 py-2 rounded-lg font-medium text-white bg-blue-600 shadow-md' : 'px-6 py-2 rounded-lg font-medium text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 hover:border-gray-400 transition-all duration-200'"
      class="mr-2">
      Monthly
    </button>
    <button 
      (click)="setChartType('yearly')" 
      [class]="chartType === 'yearly' ? 'px-6 py-2 rounded-lg font-medium text-white bg-blue-600 shadow-md' : 'px-6 py-2 rounded-lg font-medium text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 hover:border-gray-400 transition-all duration-200'">
      Yearly
    </button>
  </div>

  <!-- Orders Chart -->
  <div class="bg-gray-50 border rounded p-4 mb-6 flex flex-col items-center">
    <div class="font-semibold mb-2">Orders</div>
    <canvas #ordersChart width="600" height="250"></canvas>
  </div>
  <!-- Revenue Chart -->
  <div class="bg-gray-50 border rounded p-4 mb-6 flex flex-col items-center">
    <div class="font-semibold mb-2">Revenue</div>
    <canvas #revenueChart width="600" height="250"></canvas>
  </div>
</div>
