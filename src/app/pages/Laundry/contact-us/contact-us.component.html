<!-- Success Message Overlay -->
<div *ngIf="successMessage" class="fixed inset-0 flex items-center justify-center z-50 bg-black bg-opacity-30">
  <div class="bg-white border-2 border-green-400 text-green-700 px-10 py-8 rounded-2xl shadow-2xl flex flex-col items-center animate-bounce-in">
    <div class="flex items-center justify-center mb-4">
      <svg class="w-16 h-16 text-green-500 animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="#e6ffed"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12l3 3 5-5" stroke-width="3" />
      </svg>
    </div>
    <div class="text-2xl font-bold mb-2 text-green-700">Success!</div>
    <div class="text-lg mb-4 text-gray-700">{{ successMessage }}</div>
    <button (click)="successMessage = ''" class="mt-2 px-8 py-2 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition text-lg font-semibold shadow">Done</button>
  </div>
</div>

<app-navbar></app-navbar>

<div class="text-center mt-8 sm:mt-10 mb-4 sm:mb-6 max-w-full sm:max-w-3xl md:max-w-4xl lg:max-w-5xl mx-auto px-2">
  <h1 class="font-bold drop-shadow-md text-1xl sm:text-2xl md:text-3xl lg:text-4xl">
    Contact Us
  </h1>
  <p class="text-gray-700 text-base sm:text-md md:text-lg lg:text-xl mt-1 sm:mt-2">
    We’re here to help – let’s solve it together.
  </p>
</div>

<div class="max-w-lg mx-auto p-6 bg-white rounded-lg shadow">
  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
    <div *ngIf="error" class="text-red-600 mb-4 text-center">{{ error }}</div>

    <div class="mb-4">
      <label class="block text-gray-700 mb-1">Laundry Name</label>
      <input type="text" formControlName="laundryName" class="w-full border rounded px-3 py-2 bg-gray-100" [disabled]="true" />
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 mb-1">Email</label>
      <input type="email" formControlName="email" class="w-full border rounded px-3 py-2 bg-gray-100" [disabled]="true" />
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 mb-1">Owner Name</label>
      <input type="text" formControlName="ownerName" class="w-full border rounded px-3 py-2 bg-gray-100" [disabled]="true" />
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 mb-1">Subject</label>
      <div class="relative">
        <button 
          (click)="toggleSubjectDropdown()"
          class="w-full border rounded px-3 py-2 bg-white hover:bg-gray-50 text-gray-700 flex items-center justify-between transition duration-200"
          [class.border-red-500]="contactForm.get('subject')?.invalid && contactForm.get('subject')?.touched"
        >
          <span class="flex-1 text-left">{{ getSelectedSubject() }}</span>
          <span class="flex items-center h-full ml-2">
            <svg class="w-4 h-4 transition-transform duration-200" [class.rotate-180]="isSubjectDropdownOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </span>
        </button>
        <!-- Subject Dropdown Menu -->
        <div 
          *ngIf="isSubjectDropdownOpen"
          class="absolute top-full left-0 mt-1 bg-white border border-gray-200 rounded-md shadow-md z-10 min-w-full w-full"
        >
          <button 
            (click)="selectSubject('')"
            class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 first:rounded-t-md last:rounded-b-md transition"
            [class.bg-blue-50]="contactForm.get('subject')?.value === ''"
            [class.text-blue-600]="contactForm.get('subject')?.value === ''"
            [class.font-medium]="contactForm.get('subject')?.value === ''"
          >
            Select Subject
          </button>
          <button 
            (click)="selectSubject('General Inquiry')"
            class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 first:rounded-t-md last:rounded-b-md transition"
            [class.bg-blue-50]="contactForm.get('subject')?.value === 'General Inquiry'"
            [class.text-blue-600]="contactForm.get('subject')?.value === 'General Inquiry'"
            [class.font-medium]="contactForm.get('subject')?.value === 'General Inquiry'"
          >
            General Inquiry
          </button>
          <button 
            (click)="selectSubject('Laundry Issues')"
            class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 first:rounded-t-md last:rounded-b-md transition"
            [class.bg-blue-50]="contactForm.get('subject')?.value === 'Laundry Issues'"
            [class.text-blue-600]="contactForm.get('subject')?.value === 'Laundry Issues'"
            [class.font-medium]="contactForm.get('subject')?.value === 'Laundry Issues'"
          >
            Laundry Issues
          </button>
          <button 
            (click)="selectSubject('Payment Issues')"
            class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 first:rounded-t-md last:rounded-b-md transition"
            [class.bg-blue-50]="contactForm.get('subject')?.value === 'Payment Issues'"
            [class.text-blue-600]="contactForm.get('subject')?.value === 'Payment Issues'"
            [class.font-medium]="contactForm.get('subject')?.value === 'Payment Issues'"
          >
            Payment Issues
          </button>
          <button 
            (click)="selectSubject('Other')"
            class="w-full px-4 py-2 text-left text-sm hover:bg-gray-50 first:rounded-t-md last:rounded-b-md transition"
            [class.bg-blue-50]="contactForm.get('subject')?.value === 'Other'"
            [class.text-blue-600]="contactForm.get('subject')?.value === 'Other'"
            [class.font-medium]="contactForm.get('subject')?.value === 'Other'"
          >
            Other
          </button>
        </div>
      </div>
      <div *ngIf="contactForm.get('subject')?.invalid && contactForm.get('subject')?.touched" class="text-red-500 text-sm mt-1">
        Subject is required
      </div>
    </div>

    <div class="mb-6">
      <label class="block text-gray-700 mb-1">Message</label>
      <textarea formControlName="message" rows="4" class="w-full border rounded px-3 py-2" placeholder="Write your message..."></textarea>
    </div>

    <button type="submit" [disabled]="contactForm.invalid || loading" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 disabled:opacity-50">
      Send Message
    </button>
  </form>
</div>

<app-footer></app-footer>
