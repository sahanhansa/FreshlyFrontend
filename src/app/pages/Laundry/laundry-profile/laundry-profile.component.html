<!-- Logout Confirmation Dialog -->
<div *ngIf="showLogoutConfirmation" class="fixed inset-0 flex items-center justify-center z-50 bg-black bg-opacity-30">
  <div class="bg-white border-2 border-red-400 text-red-700 px-10 py-8 rounded-2xl shadow-2xl flex flex-col items-center animate-pulse">
    <div class="flex items-center justify-center mb-4">
      <svg class="w-16 h-16 text-red-500 animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z" />
      </svg>
    </div>
    <div class="text-2xl font-bold mb-2 text-red-700">Confirm Logout</div>
    <div class="text-lg mb-6 text-gray-700 text-center">Are you sure you want to logout?</div>
    <div class="flex gap-4">
      <button (click)="cancelLogout()" class="px-6 py-2 bg-gray-500 text-white rounded-full hover:bg-gray-600 transition text-lg font-semibold shadow">No, Cancel</button>
      <button (click)="confirmLogout()" class="px-6 py-2 bg-red-600 text-white rounded-full hover:bg-red-700 transition text-lg font-semibold shadow">Yes, Logout</button>
    </div>
  </div>
</div>

<div class="min-h-screen flex flex-col bg-gradient-to-br from-blue-50 via-white to-indigo-50">
<app-navbar></app-navbar>

  <main class="flex-grow p-6 space-y-8 max-w-7xl mx-auto w-full pt-8">

    <!-- Enhanced Stats Section -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <app-stats-card *ngFor="let stat of stats; let i = index" [stat]="stat" 
        class="transform hover:scale-105 transition-all duration-300"></app-stats-card>
    </div>

        <!-- Combined Details Section -->
    <div class="w-full">
      <app-combined-details [laundryId]="laundryId" (orderCountChanged)="onOrderCountChanged($event)"></app-combined-details>
    </div>

    <!-- Access Notice Section -->
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
      <div class="p-4">
        <app-access-notice></app-access-notice>
      </div>
    </div>

    <!-- Logout Section -->
    <div class="flex justify-end mt-8">
      <button 
        (click)="logout()"
        class="bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white font-medium px-4 py-2 rounded-lg shadow-md hover:shadow-lg transition-all duration-300 flex items-center space-x-2 group">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 group-hover:rotate-12 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        <span>Log Out</span>
      </button>
    </div>

  </main>

  <app-footer></app-footer>
</div>
