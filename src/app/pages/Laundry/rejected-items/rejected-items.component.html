<!-- Table -->
<table class="min-w-full table-auto border-collapse mt-3 mb-6">
  <thead>
    <tr class="bg-[#D0F6FF] text-left text-gray-700 font-semibold text-sm sm:text-base">
      <th class="px-4 sm:px-6 py-2 sm:py-3">Order ID</th>
      <th class="px-4 sm:px-6 py-2 sm:py-3">Item</th>
      <th class="px-4 sm:px-6 py-2 sm:py-3">Quantity</th>
      <th class="px-4 sm:px-6 py-2 sm:py-3">Services</th>
      <th class="px-4 sm:px-6 py-2 sm:py-3">Reason for Rejection</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let order of orders; let i = index"
        [ngClass]="{ 'bg-white': i % 2 === 0, 'bg-[#D0F6FF]': i % 2 === 1 }"
        class="h-14 text-sm sm:text-base text-black">
      <td class="px-4 sm:px-6 py-3 font-semibold">#{{ order.orderId }}</td>
      <td class="px-4 sm:px-6 py-3">{{ order.itemName }}</td>
      <td class="px-4 sm:px-6 py-3">{{ order.quantity }}</td>
      <td class="px-4 sm:px-6 py-3">
        <ul class="list-disc pl-4">
          <li *ngFor="let service of order.services">{{ service }}</li>
        </ul>
      </td>
      <td class="px-4 sm:px-6 py-3">{{ order.rejectionReason }}</td>
      <td class="px-4 sm:px-6 py-3 flex justify-center items-center gap-2 flex-wrap">
        <button [routerLink]="['/orders', order.orderId]" 
                class="flex items-center gap-1 border border-black text-black rounded-full px-3 py-1 text-xs sm:text-sm hover:bg-gray-500 hover:text-white transition">
          View Order
        </button>
        <button [routerLink]="['/track', order.orderId]" 
                class="flex items-center gap-1 border border-blue-600 text-blue-600 rounded-full px-3 py-1 text-xs sm:text-sm hover:bg-blue-600 hover:text-white transition">
          Track
        </button>
      </td>
    </tr>
  </tbody>
</table>
