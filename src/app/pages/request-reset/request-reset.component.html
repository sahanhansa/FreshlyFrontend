<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4 py-8">
  <div class="max-w-md w-full space-y-8">
    <!-- Header -->
    <div class="text-center">
      <h2 class="text-3xl font-bold text-gray-900 mb-2">Forgot Password</h2>
      <p class="text-gray-600">Enter your email address and we'll send you a reset code</p>
    </div>

    <!-- Main Card -->
    <div class="bg-white rounded-lg shadow-lg p-8 border border-gray-200">
      <!-- Loading Overlay -->
      <div *ngIf="isLoading" class="absolute inset-0 bg-white bg-opacity-75 flex items-center justify-center rounded-lg z-10">
        <div class="flex flex-col items-center">
          <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-2"></div>
          <p class="text-gray-600 text-sm">Sending reset code...</p>
        </div>
      </div>

      <!-- Form -->
      <form [formGroup]="resetForm" (ngSubmit)="requestReset()" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
            Email Address
          </label>
          <input
            id="email"
            formControlName="email"
            type="email"
            placeholder="Enter your email address"
            required
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200 text-gray-900 placeholder-gray-500"
            [class.border-red-500]="resetForm.get('email')?.invalid && resetForm.get('email')?.touched"
          >
          <!-- Email Validation Error -->
          <div *ngIf="resetForm.get('email')?.invalid && resetForm.get('email')?.touched" 
               class="mt-2 text-sm text-red-600">
            <span *ngIf="resetForm.get('email')?.errors?.['required']">Email is required</span>
            <span *ngIf="resetForm.get('email')?.errors?.['email']">Please enter a valid email address</span>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="resetForm.invalid || isLoading"
          class="w-full flex justify-center items-center px-4 py-3 border border-transparent text-sm font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors duration-200"
        >
          <span *ngIf="!isLoading">Send Reset Code</span>
          <span *ngIf="isLoading" class="flex items-center">
            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white mr-2"></div>
            Sending...
          </span>
        </button>
      </form>

      <!-- Success Message -->
      <div *ngIf="message && !isLoading" 
           class="mt-4 p-4 bg-green-50 border border-green-200 rounded-lg">
        <div class="flex items-center">
          <svg class="h-5 w-5 text-green-600 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
          <p class="text-green-800 font-medium">{{ message }}</p>
        </div>
      </div>

      <!-- Error Message -->
      <div *ngIf="error && !isLoading" 
           class="mt-4 p-4 bg-red-50 border border-red-200 rounded-lg">
        <div class="flex items-center">
          <svg class="h-5 w-5 text-red-600 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
          </svg>
          <p class="text-red-800 font-medium">{{ error }}</p>
        </div>
      </div>

      <!-- Back to Login Link -->
      <div class="mt-6 text-center">
        <a routerLink="/login" class="text-blue-600 hover:text-blue-700 text-sm font-medium transition-colors duration-200">
          Back to Login
        </a>
      </div>
    </div>
  </div>
</div>
