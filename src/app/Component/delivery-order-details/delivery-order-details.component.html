<div class="order-card">
    <div class="order-header">
      <span class="order-title">Order :#{{ order.id }}</span>
      <span class="status-badge">{{ order.status }}</span>
    </div>
  
    <div class="order-details">
      <div class="row">
        <span class="label">Customer Name:</span>
        <span class="value">{{ order.customerName }}</span>
      </div>
      <div class="row">
        <span class="label">Address:</span>
        <span class="value">{{ order.address }}</span>
      </div>
      <div class="row">
        <span class="label">Contact:</span>
        <span class="value">{{ order.contact }}</span>
      </div>
      <div class="row">
        <span class="label">Order Items:</span>
        <span class="value">{{ order.items }}</span>
      </div>
      <div class="row">
        <span class="label">Laundry Name:</span>
        <span class="value">{{ order.laundryName }}</span>
      </div>
      <div class="row">
        <span class="label">Payment Method:</span>
        <span class="value">{{ order.paymentMethod }}</span>
      </div>
    </div>
  
    <div>
      <label for="note" class="label">Add Note:</label>
      <textarea id="note" class="note-input" [(ngModel)]="order.note" placeholder="Enter your notes here..."></textarea>
    </div>
  
    <div class="button-group">
      <button class="edit-btn">Edit</button>
      <button>Save</button>
    </div>
  </div>
